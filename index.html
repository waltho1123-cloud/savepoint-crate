<!DOCTYPE html>
<html lang="zh-Hant" data-thermal="warm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPAS 庫存盤點裝箱系統</title>
<link rel="stylesheet" href="/assets/wiwi-colors.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ===== 顏色：全部來自 /assets/wiwi-colors.css 的 --wiwi-* 語意 token =====
   整站 html 元素帶 data-thermal="warm"（溫感橘，官網預設）。這個檔案裡不寫任何色碼或 rgb()：要半透明就用 color-mix() 從 token 調出來
   （tests/branding.test.ts 會擋）。鐵律：
   - 橘（--wiwi-thermal-fill）與藍綠只當底色、圖形，不當字，也不壓白字（2.28:1）；底在橘上的字用 --wiwi-thermal-on-fill。
   - 品牌文字一律 --wiwi-thermal-text-strong（這一頁的底都不是純白，accent 只給純白底）。
   - 互動控制項（輸入框、按鈕、分頁）的邊框用 --wiwi-border-strong（>= 3:1）；卡片、分隔線這類裝飾才用 --wiwi-border。
   - 次要文字用 --wiwi-text-muted（6.10:1）；--wiwi-text-subtle（3.45:1）不當內文。
   - 主要按鈕 = --wiwi-thermal-solid 底 + --wiwi-thermal-on-solid 字；狀態色只用「狀態色字 + 各自的 -tint 底」。
   舊的變數名稱保留（JS 產生的 HTML 裡有 var(--primary-dark)、var(--text-muted) 之類的用法），但全部改成指向 token。 */
:root {
  --primary: var(--wiwi-thermal-solid);            /* 主要按鈕底：白字 4.75:1 */
  --primary-dark: var(--wiwi-thermal-text-strong); /* 非純白底上的品牌文字（淡底 5.87:1、灰底 6.07:1） */
  --bg: var(--wiwi-surface-sunken);
  --card-solid: var(--wiwi-surface);
  --text: var(--wiwi-text);
  --text-muted: var(--wiwi-text-muted);
  --border-subtle: var(--wiwi-border);
  --radius: 16px;
  --radius-sm: 10px;
  /* 玻璃擬態與陰影：預設是不透明的 token；瀏覽器支援 color-mix() 才改成半透明（見下面的 @supports） */
  --card: var(--wiwi-surface);
  --glass-bg: var(--wiwi-surface);
  --glass-bg-strong: var(--wiwi-surface);
  --glass-border: var(--wiwi-border);
  --shadow-soft: var(--wiwi-border);
  --shadow-lift: var(--wiwi-border);
  --highlight: var(--wiwi-surface);
  --primary-glow: var(--wiwi-border);
  --glass-shadow: 0 8px 32px var(--shadow-soft);
  --neu-shadow-sm: 3px 3px 8px var(--shadow-soft), -2px -2px 6px var(--highlight);
  --neu-inset: inset 2px 2px 5px var(--shadow-soft), inset -2px -2px 5px var(--highlight);
}
@supports (color: color-mix(in srgb, red 50%, transparent)) {
  :root {
    --card: color-mix(in srgb, var(--wiwi-surface) 78%, transparent);
    --glass-bg: color-mix(in srgb, var(--wiwi-surface) 70%, transparent);
    --glass-bg-strong: color-mix(in srgb, var(--wiwi-surface) 92%, transparent);
    --glass-border: color-mix(in srgb, var(--wiwi-surface) 60%, var(--wiwi-border));
    --shadow-soft: color-mix(in srgb, var(--wiwi-text) 8%, transparent);
    --shadow-lift: color-mix(in srgb, var(--wiwi-text) 14%, transparent);
    --highlight: color-mix(in srgb, var(--wiwi-surface) 80%, transparent);
    --primary-glow: color-mix(in srgb, var(--wiwi-thermal-solid) 28%, transparent);
  }
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 15% 10%, var(--wiwi-thermal-tint) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, var(--wiwi-thermal-tint) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
  min-height: 100dvh;
}
::placeholder { color: var(--text-muted); opacity: 1; }
:focus-visible { outline: 3px solid var(--wiwi-focus-ring); outline-offset: 2px; }

/* ===== Header — 白底（Logo 的橘與藍綠要在淺底上才看得見）＋品牌橘底線 ===== */
.header {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  color: var(--text);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 3px solid var(--wiwi-thermal-border);
}
.brand-logo { display: block; flex: none; height: 48px; width: auto; }
.header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: .3px;
  margin-right: auto;
}
.header-actions { display: flex; gap: 8px; }

/* ===== 使用者列：登入者、我的帳號、設定（管理員）、登出 ===== */
.userbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 4px 14px;
  padding: 6px 16px;
  font-size: .82rem;
  color: var(--text-muted);
  background: var(--wiwi-surface-sunken);
  border-bottom: 1px solid var(--border-subtle);
}
.userbar[hidden], .userbar a[hidden] { display: none; }
.userbar #userbar-user { font-weight: 600; color: var(--text); }
.userbar a { color: var(--primary-dark); font-weight: 600; text-decoration: none; }
.userbar a:hover { text-decoration: underline; }
.userbar button {
  border: 1px solid var(--wiwi-border-strong);
  background: var(--card-solid);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 3px 12px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
}

/* ===== Buttons — Soft UI ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s ease;
  white-space: nowrap;
  letter-spacing: .2px;
}
.btn:active { transform: scale(.96); }
/* 主要按鈕：實心深橘 + 白字（4.75:1；hover／active 換更深的 solid） */
.btn-primary {
  background: var(--wiwi-thermal-solid);
  color: var(--wiwi-thermal-on-solid);
  box-shadow: 0 4px 14px var(--primary-glow);
}
.btn-primary:hover {
  background: var(--wiwi-thermal-solid-hover);
  box-shadow: 0 6px 20px var(--primary-glow);
  transform: translateY(-1px);
}
.btn-primary:active { background: var(--wiwi-thermal-solid-active); }
/* 危險／成功：狀態色字 + 各自的淡底 + 同色邊框；hover 反過來（淡底字壓在狀態色上，同一組對比） */
.btn-danger {
  background: var(--wiwi-danger-tint);
  color: var(--wiwi-danger);
  border-color: var(--wiwi-danger);
}
.btn-danger:hover { background: var(--wiwi-danger); color: var(--wiwi-danger-tint); transform: translateY(-1px); }
.btn-success {
  background: var(--wiwi-success-tint);
  color: var(--wiwi-success);
  border-color: var(--wiwi-success);
}
.btn-success:hover { background: var(--wiwi-success); color: var(--wiwi-success-tint); transform: translateY(-1px); }
.btn-outline {
  background: var(--glass-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--wiwi-border-strong);
  color: var(--text);
}
.btn-outline:hover { background: var(--wiwi-thermal-tint); }
.btn-sm { padding: 7px 14px; font-size: .82rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* ===== Cards — Glass + Neumorphism ===== */
.card {
  background: var(--card);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--glass-shadow);
  padding: 22px;
  margin-bottom: 16px;
  transition: box-shadow .25s ease;
}
.card:hover { box-shadow: 0 10px 40px var(--shadow-lift); }
.card-title {
  font-size: .95rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  letter-spacing: .2px;
}

/* Main layout */
.main { max-width: 920px; margin: 0 auto; padding: 20px 16px; }

/* ===== Inputs — 邊框用 border-strong（互動控制項 >= 3:1） ===== */
.box-create-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.box-create-row input,
.manual-input-row input {
  flex: 1;
  min-width: 140px;
  padding: 11px 16px;
  border: 1px solid var(--wiwi-border-strong);
  border-radius: var(--radius-sm);
  font-size: 16px;
  background: var(--wiwi-surface);
  box-shadow: var(--neu-inset);
  transition: all .2s;
  color: var(--text);
}
.box-create-row input:focus,
.manual-input-row input:focus {
  border-color: var(--wiwi-focus-ring);
  box-shadow: var(--neu-inset), 0 0 0 3px var(--primary-glow);
}
.manual-input-row input { font-family: 'SF Mono', 'Fira Code', monospace; }

/* ===== Current box banner — 品牌淡底 ===== */
.current-box-banner {
  background: var(--wiwi-thermal-tint);
  color: var(--text);
  border: 1px solid var(--wiwi-thermal-border);
  border-radius: var(--radius);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.current-box-banner .box-id {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary-dark);
}
.current-box-banner .box-status {
  font-size: .78rem;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 600;
  letter-spacing: .3px;
  text-transform: uppercase;
}
.status-open {
  background: var(--wiwi-success-tint);
  color: var(--wiwi-success);
  border: 1px solid var(--wiwi-success);
}
.status-closed {
  background: var(--wiwi-surface-sunken);
  color: var(--text-muted);
  border: 1px solid var(--wiwi-border-strong);
}

/* ===== Scanner ===== */
.scanner-area {
  position: relative;
  background: var(--wiwi-surface-sunken);
  border: 2px dashed var(--wiwi-border-strong);
  border-radius: var(--radius-sm);
  overflow: hidden;
  aspect-ratio: 4/3;
  max-height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.scanner-area video { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
.btn-capture {
  background: var(--wiwi-thermal-solid);
  color: var(--wiwi-thermal-on-solid);
  font-size: 1rem;
  font-weight: 700;
  padding: 14px 28px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  width: 100%;
  box-shadow: 0 4px 14px var(--primary-glow);
}
.btn-capture:hover { background: var(--wiwi-thermal-solid-hover); }
.btn-capture:active { background: var(--wiwi-thermal-solid-active); }
.btn-capture:disabled { opacity: .5; cursor: not-allowed; }
.scanner-placeholder {
  color: var(--text-muted);
  text-align: center;
  padding: 40px 20px;
}
.scanner-placeholder .icon {
  font-size: 2.2rem;
  margin-bottom: 10px;
}

/* ===== Scan list ===== */
.scan-list { list-style: none; }
.scan-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 12px;
  margin-bottom: 6px;
  border-radius: var(--radius-sm);
  background: var(--glass-bg);
  box-shadow: var(--neu-shadow-sm);
  gap: 10px;
  transition: all .15s;
}
.scan-list li:hover { background: var(--wiwi-thermal-tint); }
.scan-item-info { flex: 1; min-width: 0; }
.scan-item-barcode {
  font-weight: 700;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: .9rem;
  color: var(--text);
}
.scan-item-name { color: var(--text-muted); font-size: .82rem; margin-top: 1px; }
.scan-item-detail { color: var(--text-muted); font-size: .78rem; margin-top: 1px; display: flex; gap: 6px; flex-wrap: wrap; }
.scan-item-detail span { background: var(--wiwi-thermal-tint); padding: 1px 6px; border-radius: 4px; }
.scan-item-time { color: var(--text-muted); font-size: .78rem; white-space: nowrap; }
.scan-list .empty {
  color: var(--text-muted);
  text-align: center;
  padding: 28px;
  background: none;
  box-shadow: none;
}

/* ===== Box tabs — Soft pills ===== */
.box-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.box-tab {
  padding: 7px 16px;
  border-radius: 24px;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--wiwi-border-strong);
  background: var(--wiwi-surface);
  box-shadow: var(--neu-shadow-sm);
  transition: all .2s;
  color: var(--text);
}
.box-tab:hover { background: var(--wiwi-thermal-tint); }
.box-tab.closed { background: var(--wiwi-surface-sunken); color: var(--text-muted); }
.box-tab.active {
  background: var(--wiwi-thermal-fill);
  color: var(--wiwi-thermal-on-fill);
  border-color: var(--wiwi-thermal-solid); /* 橘 fill 對白底只有 2.2:1，選取狀態的邊界用深橘（4.75:1） */
  box-shadow: 0 4px 14px var(--primary-glow);
}
.box-tab-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  position: relative;
}
.box-tab-actions {
  display: none;
  gap: 3px;
  margin-left: 4px;
}
.box-tab-wrapper:hover .box-tab-actions,
.box-tab-wrapper.active .box-tab-actions { display: inline-flex; }
.box-action-btn {
  width: 22px;
  height: 22px;
  border: 1px solid var(--wiwi-border-strong);
  border-radius: 50%;
  font-size: .68rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--wiwi-surface-sunken);
  color: var(--text-muted);
  transition: all .2s;
  padding: 0;
  line-height: 1;
}
.box-action-btn:hover { background: var(--wiwi-thermal-tint); color: var(--primary-dark); }
.box-action-btn.delete:hover {
  background: var(--wiwi-danger);
  color: var(--wiwi-danger-tint);
  border-color: var(--wiwi-danger);
}

/* Inline edit input */
.box-edit-input {
  padding: 5px 10px;
  border: 2px solid var(--wiwi-thermal-solid);
  border-radius: 8px;
  font-size: .82rem;
  font-weight: 600;
  width: 120px;
  background: var(--wiwi-surface);
  color: var(--text);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

/* ===== Stats table — Clean minimal ===== */
.stats-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .88rem; }
.stats-table th {
  background: var(--wiwi-surface-sunken);
  text-align: left;
  padding: 11px 14px;
  font-weight: 700;
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
}
.stats-table th:first-child { border-radius: var(--radius-sm) 0 0 0; }
.stats-table th:last-child { border-radius: 0 var(--radius-sm) 0 0; }
.stats-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-subtle);
}
.stats-table tr:hover td { background: var(--wiwi-thermal-tint); }
.stats-table .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: .85rem; }
.stats-table .qty {
  font-weight: 800;
  text-align: center;
  color: var(--primary-dark);
}
.stats-empty { text-align: center; color: var(--text-muted); padding: 36px; }

/* ===== Toast — 預設是反白（深字底＋白字），成功／失敗用狀態色字 + 淡底 ===== */
.toast-container {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.toast {
  background: var(--wiwi-text);
  color: var(--wiwi-surface);
  padding: 11px 24px;
  border-radius: 28px;
  font-size: .88rem;
  font-weight: 500;
  box-shadow: 0 8px 28px var(--shadow-lift);
  animation: toastIn .35s cubic-bezier(.22,1,.36,1);
  border: 1px solid var(--wiwi-text);
}
.toast.success {
  background: var(--wiwi-success-tint);
  color: var(--wiwi-success);
  border-color: var(--wiwi-success);
}
.toast.error {
  background: var(--wiwi-danger-tint);
  color: var(--wiwi-danger);
  border-color: var(--wiwi-danger);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(14px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Print header (hidden on screen) */
.print-header { display: none; }

/* Box label print area (hidden on screen) */
.box-label-print { display: none; }
.box-label-header { text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--wiwi-text); }
.box-label-header h2 { font-size: 1.4rem; margin-bottom: 4px; }
.box-label-meta { font-size: .85rem; color: var(--text-muted); }
.box-label-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.box-label-table th { background: var(--wiwi-surface-sunken); text-align: left; padding: 8px 10px; font-weight: 700; border-bottom: 2px solid var(--wiwi-text); }
.box-label-table td { padding: 8px 10px; border-bottom: 1px solid var(--wiwi-border); }
.box-label-table .mono { font-family: monospace; }
.box-label-table .qty { font-weight: 700; text-align: center; }
.box-label-footer { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--wiwi-border); font-size: .85rem; color: var(--text-muted); text-align: right; }

/* Sections visibility */
.section { display: none; }
.section.active { display: block; animation: fadeSection .3s ease; }
@keyframes fadeSection {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Nav tabs — Glass pill bar ===== */
.nav-tabs {
  display: flex;
  gap: 0;
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--neu-shadow-sm);
  margin-bottom: 20px;
  overflow: hidden;
  padding: 4px;
}
.nav-tab {
  flex: 1;
  padding: 11px 8px;
  text-align: center;
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  transition: all .2s;
  border-radius: calc(var(--radius) - 4px);
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active {
  color: var(--wiwi-thermal-on-fill);
  background: var(--wiwi-thermal-fill);
  border-color: var(--wiwi-thermal-solid); /* 選取狀態的邊界用深橘（對白底 4.75:1），橘 fill 單獨只有 2.2:1 */
  box-shadow: 0 4px 14px var(--primary-glow);
}

/* ===== Dialog ===== */
.dialog-backdrop {
  position: fixed;
  inset: 0;
  background: var(--wiwi-overlay);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dialog {
  background: var(--wiwi-surface-raised);
  color: var(--text);
  border: 1px solid var(--wiwi-border);
  border-radius: var(--radius);
  padding: 28px;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 20px 60px var(--shadow-lift);
  animation: dialogIn .25s cubic-bezier(.22,1,.36,1);
}
@keyframes dialogIn {
  from { opacity: 0; transform: scale(.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.dialog h3 { margin-bottom: 8px; font-size: 1.05rem; }
.dialog p { color: var(--text-muted); margin-bottom: 20px; font-size: .9rem; line-height: 1.5; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
.dialog-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.dialog-form label { font-size: .85rem; font-weight: 600; color: var(--text); }
.dialog-form input, .dialog-form select {
  padding: 9px 12px; border: 1px solid var(--wiwi-border-strong); border-radius: var(--radius-sm);
  font-size: 16px; background: var(--wiwi-surface); box-shadow: var(--neu-inset);
  color: var(--text); transition: border-color .2s;
}
.dialog-form input:focus, .dialog-form select:focus { border-color: var(--wiwi-focus-ring); }

        <th>數量</th>

<div class="toast-container" id="toast-container"></div>

<script>
// ========== Store ==========
const Store = {
  KEY: 'ipas-state',
  saveState(state) {
    try { localStorage.setItem(this.KEY, JSON.stringify(state)); } catch(e) {}
  },
  loadState() {
    try {
      const d = localStorage.getItem(this.KEY);
      return d ? JSON.parse(d) : null;
    } catch(e) { return null; }
  },
  clearState() { localStorage.removeItem(this.KEY); }
};

// ========== App State ==========
let state = Store.loadState() || { boxes: [], currentBoxId: null, lastBoxSeq: 0, productCache: {} };
if (!state.productCache) state.productCache = {};

function persist() { Store.saveState(state); }

// ========== BoxManager ==========
const BoxManager = {
  createBox(customId) {
    let id;
    if (customId && customId.trim()) {
      id = customId.trim();
    } else {
      state.lastBoxSeq++;
      id = 'BOX-' + String(state.lastBoxSeq).padStart(3, '0');
    }
    if (state.boxes.find(b => b.id === id)) {
      showToast('箱號已存在：' + id, 'error');
      return null;
    }
    const box = { id, createdAt: new Date().toISOString(), status: 'open', items: [] };
    state.boxes.push(box);
    state.currentBoxId = id;
    persist();
    return box;
  },
  closeBox(boxId) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return;
    box.status = 'closed';
    if (state.currentBoxId === boxId) state.currentBoxId = null;
    persist();
  },
  addItem(boxId, barcode, info) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box || box.status === 'closed') return null;
    info = info || {};
    const item = {
      scanId: crypto.randomUUID(),
      barcode: barcode.trim(),
      productName: info.productName || '',
      gender: info.gender || '',
      color: info.color || '',
      size: info.size || '',
      qty: info.qty || 1,
      scannedAt: new Date().toISOString()
    };
    box.items.push(item);
    persist();
    return item;
  },
  removeItem(boxId, scanId) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return;
    box.items = box.items.filter(i => i.scanId !== scanId);
    persist();
  },
  updateItem(boxId, scanId, updates) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return null;
    const item = box.items.find(i => i.scanId === scanId);
    if (!item) return null;
    if (updates.productName !== undefined) item.productName = updates.productName;
    if (updates.gender !== undefined) item.gender = updates.gender;
    if (updates.color !== undefined) item.color = updates.color;
    if (updates.size !== undefined) item.size = updates.size;
    if (updates.qty !== undefined) item.qty = updates.qty;
    persist();
    return item;
  },
  renameBox(boxId, newId) {
    newId = newId.trim();
    if (!newId) return false;
    if (newId === boxId) return true;
    if (state.boxes.find(b => b.id === newId)) {
      showToast('箱號已存在：' + newId, 'error');
      return false;
    }
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return false;
    box.id = newId;
    if (state.currentBoxId === boxId) state.currentBoxId = newId;
    persist();
    return true;
  },
  deleteBox(boxId) {
    state.boxes = state.boxes.filter(b => b.id !== boxId);
    if (state.currentBoxId === boxId) state.currentBoxId = null;
    persist();
  },
  getBox(boxId) { return state.boxes.find(b => b.id === boxId) || null; },
  getCurrentBox() { return state.currentBoxId ? this.getBox(state.currentBoxId) : null; }
};

// ========== AggregationEngine ==========
const AggregationEngine = {
  aggregate(boxes) {
    const map = new Map();
    for (const box of boxes) {
      for (const item of box.items) {
        if (!map.has(item.barcode)) {
          map.set(item.barcode, { barcode: item.barcode, productName: item.productName, gender: item.gender || '', color: item.color || '', size: item.size || '', totalQty: 0, boxes: [] });
        }
        const agg = map.get(item.barcode);
        agg.totalQty += (item.qty || 1);
        if (!agg.productName && item.productName) agg.productName = item.productName;
        if (!agg.gender && item.gender) agg.gender = item.gender;
        if (!agg.color && item.color) agg.color = item.color;
        if (!agg.size && item.size) agg.size = item.size;
        if (!agg.boxes.includes(box.id)) agg.boxes.push(box.id);
      }
    }
    return Array.from(map.values()).sort((a, b) => a.barcode.localeCompare(b.barcode));
  }
};

// ========== CameraEngine ==========
const CameraEngine = {
  _stream: null,

  async start(videoEl) {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    videoEl.srcObject = stream;
    this._stream = stream;
  },

  stop(videoEl) {
    if (this._stream) {
      this._stream.getTracks().forEach(t => t.stop());
      this._stream = null;
    }
    if (videoEl) videoEl.srcObject = null;
  },

  captureFrame(videoEl) {
    if (!videoEl || !videoEl.videoWidth) return null;
    const MAX_W = 1024;
    let w = videoEl.videoWidth, h = videoEl.videoHeight;
    if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(videoEl, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', 0.7);
  }
};

// ========== ApiClient (所有 /api 請求共用：帶 CSRF 標頭 X-Requested-With；回 401＝登入過期，導回登入頁) ==========
const ApiClient = {
  expired: false,

  // 沒登入或登入過期：導到登入頁，登入後回到目前這一頁。箱子的資料都在 localStorage，不受影響。
  toLogin() {
    this.expired = true;
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
  },

  async request(url, init) {
    const resp = await fetch(url, init);
    if (resp.status === 401) this.toLogin();
    return resp;
  },

  post(url, payload) {
    return this.request(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify(payload)
    });
  },

  get(url) {
    return this.request(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
  }
};

// ========== OCREngine (後端 /api/ocr → OpenAI Vision) ==========
const OCREngine = {
  WEBHOOK_URL: '/api/ocr',

  async recognize(imageDataUrl, boxId) {
    if (!imageDataUrl) return null;
    try {
      const resp = await ApiClient.post(this.WEBHOOK_URL, { barcode: '', boxId: boxId || '', image: imageDataUrl });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const result = await resp.json();
      if (result.success && result.data) return result.data;
      return null;
    } catch(e) {
      console.error('OCR API error:', e);
      return null;
    }
  }
};

// ========== SaveEngine (後端 /api/save → Google Sheets) ==========
const SaveEngine = {
  SAVE_URL: '/api/save',

  async saveBoxItems(box) {
    if (!box || box.items.length === 0) return { success: false, error: '無資料可儲存' };

    const results = [];
    const now = new Date();
    const taipeiOffset = 8 * 60 * 60 * 1000;
    const dateStr = new Date(now.getTime() + taipeiOffset).toISOString().split('T')[0].replace(/-/g, '/');
    const timeStr = new Date(now.getTime() + taipeiOffset).toISOString().replace('T', ' ').substring(0, 19);

    // ★ 逐筆發送，不聚合 — 尊重使用者編輯後的數量
    for (let i = 0; i < box.items.length; i++) {
      const item = box.items[i];
      try {
        const payload = {
          seqNo: String(i + 1),
          date: dateStr,
          boxId: box.id,
          barcode: item.barcode,
          productName: item.productName || '',
          gender: item.gender || '',
          color: item.color || '',
          size: item.size || '',
          quantity: item.qty || 1,
          time: timeStr
        };
        const resp = await ApiClient.post(this.SAVE_URL, payload);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const result = await resp.json();
        results.push({ barcode: item.barcode, success: result.success });
      } catch (e) {
        console.error('Save error for', item.barcode, e);
        results.push({ barcode: item.barcode, success: false, error: e.message });
        if (ApiClient.expired) break; // 登入過期：頁面正在導向登入頁，別再對後面每一筆重複送
      }
    }

    const successCount = results.filter(r => r.success).length;
    return {
      success: successCount === results.length,
      total: results.length,
      successCount,
      failCount: results.length - successCount,
      results
    };
  }
};

// ========== NotifyEngine (後端 /api/box-closed → LINE 群組通知) ==========
const NotifyEngine = {
  NOTIFY_URL: '/api/box-closed',

  // 關箱後通知 LINE 群組。任何失敗都不能影響關箱：整段包 try/catch，只在推播失敗時提示，其餘只寫 console。
  // saveResult 是 SaveEngine.saveBoxItems 的回傳；它丟例外（null）時，成功筆數算 0。
  async boxClosed(box, saveResult) {
    try {
      // 空箱子（沒有任何商品）不通知：同步會顯示「無資料可儲存」，再發一則「已完成」的 LINE 訊息只會互相矛盾。
      if (Array.isArray(box.items) && box.items.length === 0) return;
      // 超過後端驗證上限的值（數量 9999、文字 200 字、500 筆）先截斷：不然整則通知會被 400 擋掉、什麼都收不到。
      const clip = value => String(value || '').slice(0, 200);
      const items = box.items.slice(0, 500).map(item => ({
        barcode: clip(item.barcode),
        productName: clip(item.productName),
        gender: clip(item.gender),
        color: clip(item.color),
        size: clip(item.size),
        qty: Math.min(9999, Math.max(1, parseInt(item.qty, 10) || 1))
      }));
      const total = saveResult && typeof saveResult.total === 'number' ? saveResult.total : items.length;
      const successCount = saveResult && typeof saveResult.successCount === 'number' ? saveResult.successCount : 0;
      const failedCount = saveResult && typeof saveResult.failCount === 'number' ? saveResult.failCount : total - successCount;
      const resp = await ApiClient.post(this.NOTIFY_URL, { boxId: box.id, closedAt: new Date().toISOString(), items, total, successCount, failedCount });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const result = await resp.json();
      if (result.notified === false && result.reason === 'push_failed') {
        showToast('LINE 通知失敗（不影響關箱）', 'error');
      }
    } catch (e) {
      console.error('LINE notify error:', e);
    }
  }
};

// ========== CloseFlow (關箱的同步流程：先確認登入還有效，再同步到商品主檔；登入過期時整個中止，箱子保持開啟) ==========
const CloseFlow = {
  // 送出任何一筆之前先問伺服器「我還登入著嗎」：過期（401）時 ApiClient 已經在導向登入頁，這裡回 false。
  // 網路斷線或伺服器錯誤不算過期（回 true）：照原本的流程走，同步失敗會顯示在提示裡，箱子仍然完成。
  async sessionAlive() {
    try {
      await ApiClient.get('/api/me');
    } catch (e) {
      console.error('Session check failed:', e);
    }
    return !ApiClient.expired;
  },

  // 回傳 { proceed, saveResult }：
  //   proceed=false：登入過期（頁面正在導向登入頁），箱子保持開啟、沒有任何「已完成」的提示；登入後再按一次「完成此箱」。
  //   proceed=true：其他任何結果（全部成功、部分失敗、全部失敗、同步丟例外）都照原本的行為完成這個箱子。
  //   saveResult：SaveEngine.saveBoxItems 的回傳；它丟例外時是 null（關箱通知用）。
  async sync(box) {
    if (!(await this.sessionAlive())) return { proceed: false, saveResult: null };
    showToast('正在同步到商品主檔…', '');
    let saveResult = null;
    let saveError = null;
    try {
      saveResult = await SaveEngine.saveBoxItems(box);
    } catch (e) {
      saveError = e;
    }
    // 同步途中登入過期：不要把箱子鎖起來卻沒同步完（頁面正在導向登入頁，提示也來不及看）。
    if (ApiClient.expired) return { proceed: false, saveResult };
    if (saveError) {
      console.error('Save failed:', saveError);
      showToast('同步發生錯誤：' + saveError.message, 'error');
    } else if (saveResult.success) {
      showToast(`已同步 ${saveResult.successCount} 筆到商品主檔 ✓`, 'success');
    } else if (saveResult.successCount > 0) {
      showToast(`部分同步：${saveResult.successCount}/${saveResult.total} 筆成功`, 'error');
    } else {
      showToast('同步失敗，但箱號仍會完成', 'error');
    }
    return { proceed: true, saveResult };
  }
};

// ========== PrintManager ==========
const PrintManager = {
  _setPrintMode(mode) {
    document.body.classList.remove('print-mode-stats', 'print-mode-box');
    if (mode) document.body.classList.add('print-mode-' + mode);
  },
  printStats() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('zh-TW') + ' ' + now.toLocaleTimeString('zh-TW');
    const boxCount = state.boxes.length;
    const closedCount = state.boxes.filter(b => b.status === 'closed').length;
    document.getElementById('print-meta').textContent =
      `列印日期：${dateStr}　|　總箱數：${boxCount}　|　已完成：${closedCount}`;
    this._setPrintMode('stats');
    window.print();
    this._setPrintMode(null);
  },
  printBoxLabel(boxId) {
    const box = BoxManager.getBox(boxId);
    if (!box) return;

    // Aggregate items within this box
    const map = new Map();
    for (const item of box.items) {
      if (!map.has(item.barcode)) {
        map.set(item.barcode, { barcode: item.barcode, productName: item.productName, gender: item.gender || '', color: item.color || '', size: item.size || '', qty: 0 });
      }
      const agg = map.get(item.barcode);
      agg.qty += (item.qty || 1);
      if (!agg.productName && item.productName) agg.productName = item.productName;
      if (!agg.gender && item.gender) agg.gender = item.gender;
      if (!agg.color && item.color) agg.color = item.color;
      if (!agg.size && item.size) agg.size = item.size;
    }
    const aggItems = Array.from(map.values()).sort((a, b) => a.barcode.localeCompare(b.barcode));
    const totalQty = aggItems.reduce((s, a) => s + a.qty, 0);

    // Fill print area
    const now = new Date();
    const dateStr = now.toLocaleDateString('zh-TW') + ' ' + now.toLocaleTimeString('zh-TW');
    document.getElementById('box-label-title').textContent = `裝箱標籤單 — ${box.id}`;
    document.getElementById('box-label-meta').textContent =
      `狀態：${box.status === 'closed' ? '已完成' : '開放中'}　|　建立時間：${new Date(box.createdAt).toLocaleString('zh-TW')}　|　列印時間：${dateStr}`;

    const tbody = document.getElementById('box-label-tbody');
    tbody.innerHTML = '';
    aggItems.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td class="mono">${escHtml(item.barcode)}</td>
        <td>${escHtml(item.productName) || '—'}</td>
        <td>${escHtml(item.gender) || '—'}</td>
        <td>${escHtml(item.color) || '—'}</td>
        <td>${escHtml(item.size) || '—'}</td>
        <td class="qty">${item.qty}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('box-label-footer').textContent =
      `共 ${aggItems.length} 種商品，合計 ${totalQty} 件`;

    this._setPrintMode('box');
    window.print();
    this._setPrintMode(null);
  }
};

  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.remove(); }, 2500);
}

// Close box — save to Google Sheets first, then close
document.getElementById('btn-close-box').addEventListener('click', () => {
  const box = BoxManager.getCurrentBox();
  if (!box) return;
  const totalQty = box.items.reduce((s, i) => s + (i.qty || 1), 0);
  showDialog('完成裝箱確認', `確定要完成箱號 ${box.id} 嗎？（共 ${box.items.length} 種商品，${totalQty} 件）\n完成後將同步到 Google Sheets 並鎖定此箱。`, async () => {
    CameraEngine.stop(document.getElementById('camera-video'));

    // 同步到商品主檔（Google Sheets）。登入已過期時什麼都不做、箱子保持開啟（頁面正在導向登入頁，登入後再按一次「完成此箱」）。
    const outcome = await CloseFlow.sync(box);
    if (!outcome.proceed) return;

    // 關箱通知（LINE 群組）：不等回應、失敗不影響關箱
    NotifyEngine.boxClosed(box, outcome.saveResult);

// Capture photo and send to OCR
document.getElementById('btn-capture').addEventListener('click', async () => {
  const videoEl = document.getElementById('camera-video');
  const statusEl = document.getElementById('ocr-status');
  const captureBtn = document.getElementById('btn-capture');
  const box = BoxManager.getCurrentBox();
  if (!box || box.status === 'closed') {
    showToast('請先建立或選擇一個開放中的箱號', 'error');
    return;
  }

  const frame = CameraEngine.captureFrame(videoEl);
  if (!frame) {
    showToast('無法擷取畫面，請確認相機已開啟', 'error');
    return;
  }

  captureBtn.disabled = true;
  statusEl.style.display = '';
  statusEl.textContent = '辨識中，請稍候…';

  try {
    const result = await OCREngine.recognize(frame, box.id);
    statusEl.textContent = '';
    statusEl.style.display = 'none';
    captureBtn.disabled = false;

    if (!result) {
      showToast('辨識失敗，請重新拍照', 'error');
      return;
    }

    const barcode = (result.barcode || result.productCode || '').trim();
    const info = {
      productName: result.productName || '',
      gender: result.gender || '',
      color: result.color || '',
      size: result.size || ''
    };

    // If barcode found and cached, auto-add
    if (barcode && state.productCache[barcode]) {
      BoxManager.addItem(box.id, barcode, state.productCache[barcode]);
      try { navigator.vibrate?.(100); } catch(e) {}
      showToast('掃描成功：' + barcode, 'success');
      renderScanList();
      return;
    }

    // Show dialog with pre-filled info for confirmation
    showProductDialog(barcode, info, (confirmedBarcode, confirmedInfo) => {
      if (!confirmedBarcode) {
        showToast('商品編號不可為空', 'error');
        return;
      }
      state.productCache[confirmedBarcode] = confirmedInfo;
      persist();
      BoxManager.addItem(box.id, confirmedBarcode, confirmedInfo);
      try { navigator.vibrate?.(100); } catch(e) {}
      showToast('已加入：' + confirmedBarcode, 'success');
      renderScanList();
    });
  } catch(e) {
    statusEl.textContent = '';
    statusEl.style.display = 'none';
    captureBtn.disabled = false;
    showToast('辨識發生錯誤：' + e.message, 'error');
  }
});

function addManualBarcode(barcode) {
  const box = BoxManager.getCurrentBox();
  if (!box || box.status === 'closed') {
    showToast('請先建立或選擇一個開放中的箱號', 'error');
    return;
  }
  barcode = barcode.trim();
  if (!barcode) return;

  const cached = state.productCache[barcode];
  if (cached) {
    BoxManager.addItem(box.id, barcode, cached);
    try { navigator.vibrate?.(100); } catch(e) {}
    showToast('已加入：' + barcode, 'success');
    renderScanList();
    return;
  }

  showProductDialog(barcode, {}, (confirmedBarcode, confirmedInfo) => {
    if (!confirmedBarcode) {
      showToast('商品編號不可為空', 'error');
      return;
    }
    state.productCache[confirmedBarcode] = confirmedInfo;
    persist();
    BoxManager.addItem(box.id, confirmedBarcode, confirmedInfo);
    try { navigator.vibrate?.(100); } catch(e) {}
    showToast('已加入：' + confirmedBarcode, 'success');
    renderScanList();
  });
}

// ========== Render Functions ==========

function renderAll() {
  renderBoxTabs();
  renderCurrentBox();
  renderScanList();
}

function renderBoxTabs() {
  const container = document.getElementById('box-tabs');
  container.innerHTML = '';
  for (const box of state.boxes) {
    const wrapper = document.createElement('div');
    wrapper.className = 'box-tab-wrapper' + (state.currentBoxId === box.id ? ' active' : '');

    const tab = document.createElement('div');
    tab.className = 'box-tab' +
      (state.currentBoxId === box.id ? ' active' : '') +
      (box.status === 'closed' ? ' closed' : '');
    const boxTotalQty = box.items.reduce((s, i) => s + (i.qty || 1), 0);
    tab.textContent = box.id + (box.status === 'closed' ? ' ✓' : ` (${boxTotalQty})`);
    tab.addEventListener('click', () => {
      state.currentBoxId = box.id;
      persist();
      renderAll();
    });
    wrapper.appendChild(tab);

    const actions = document.createElement('div');
    actions.className = 'box-tab-actions';

    // Edit button
    const editBtn = document.createElement('button');
    editBtn.className = 'box-action-btn';
    editBtn.title = '編輯箱號';
    editBtn.textContent = '✎';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startEditBox(box.id, wrapper, tab);
    });
    actions.appendChild(editBtn);

    // Delete button
    const delBtn = document.createElement('button');
    delBtn.className = 'box-action-btn delete';
    delBtn.title = '刪除箱號';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const itemCount = box.items.length;
      const msg = itemCount > 0
        ? `確定要刪除箱號 ${box.id} 嗎？箱內有 ${itemCount} 筆掃描記錄將一併刪除。`
        : `確定要刪除箱號 ${box.id} 嗎？`;
      showDialog('刪除箱號', msg, () => {
        if (state.currentBoxId === box.id) {
          CameraEngine.stop(document.getElementById('camera-video'));
          resetScannerUI();
        }
        BoxManager.deleteBox(box.id);
        showToast('已刪除箱號：' + box.id, '');
        renderAll();
      });
    });
    actions.appendChild(delBtn);

    wrapper.appendChild(actions);
    container.appendChild(wrapper);
  }
}

function startEditBox(boxId, wrapper, tabEl) {
  const input = document.createElement('input');
  input.className = 'box-edit-input';
  input.value = boxId;
  input.maxLength = 20;

  tabEl.style.display = 'none';
  const actions = wrapper.querySelector('.box-tab-actions');
  if (actions) actions.style.display = 'none';
  wrapper.insertBefore(input, tabEl);
  input.focus();
  input.select();

  function finish() {
    const newId = input.value.trim();
    if (newId && newId !== boxId) {
      if (BoxManager.renameBox(boxId, newId)) {
        showToast(`箱號已更名：${boxId} → ${newId}`, 'success');
      }
    }
    renderAll();
  }
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = boxId; input.blur(); }
  });
}

function renderCurrentBox() {
  const banner = document.getElementById('current-box-banner');
  const scannerCard = document.getElementById('scanner-card');
  const itemListCard = document.getElementById('item-list-card');
  const box = BoxManager.getCurrentBox();

  if (!box) {
    banner.style.display = 'none';
    scannerCard.style.display = 'none';
    itemListCard.style.display = 'none';
    CameraEngine.stop(document.getElementById('camera-video'));
    resetScannerUI();
    return;
  }

  banner.style.display = '';
  document.getElementById('current-box-id').textContent = box.id;
  const statusEl = document.getElementById('current-box-status');
  if (box.status === 'open') {
    statusEl.textContent = '開放中';
    statusEl.className = 'box-status status-open';
    scannerCard.style.display = '';
    document.getElementById('btn-close-box').style.display = '';
  } else {
    statusEl.textContent = '已完成';
    statusEl.className = 'box-status status-closed';
    scannerCard.style.display = 'none';
    document.getElementById('btn-close-box').style.display = 'none';
    CameraEngine.stop(document.getElementById('camera-video'));
    resetScannerUI();
  }
  itemListCard.style.display = '';
}

function resetScannerUI() {
  const videoEl = document.getElementById('camera-video');
  CameraEngine.stop(videoEl);
  videoEl.style.display = 'none';
  document.getElementById('scanner-placeholder').style.display = '';
  document.getElementById('btn-start-scan').style.display = '';
  document.getElementById('btn-stop-scan').style.display = 'none';
  document.getElementById('btn-capture').style.display = 'none';
  document.getElementById('ocr-status').style.display = 'none';
}

function renderScanList() {
  const box = BoxManager.getCurrentBox();
  const list = document.getElementById('scan-list');
  const count = document.getElementById('item-count');

  if (!box || box.items.length === 0) {
    list.innerHTML = '<li class="empty">尚無掃描記錄</li>';
    count.textContent = '0';
    return;
  }

  const totalQty = box.items.reduce((s, i) => s + (i.qty || 1), 0);
  count.textContent = totalQty;
  list.innerHTML = '';

  // Show in reverse order (newest first)
  for (let i = box.items.length - 1; i >= 0; i--) {
    const item = box.items[i];
    const li = document.createElement('li');
    const canEdit = box.status === 'open';
    const itemQty = item.qty || 1;
    const details = [item.gender, item.color, item.size].filter(Boolean);
    li.innerHTML = `
      <div class="scan-item-info">
        <div class="scan-item-barcode">${escHtml(item.barcode)}${itemQty > 1 ? ` <span style="color:var(--primary-dark);font-size:.82rem">×${itemQty}</span>` : ''}</div>
        ${item.productName ? `<div class="scan-item-name">${escHtml(item.productName)}</div>` : ''}
        ${details.length ? `<div class="scan-item-detail">${details.map(d => `<span>${escHtml(d)}</span>`).join('')}</div>` : ''}
      </div>
      <span class="scan-item-time">${new Date(item.scannedAt).toLocaleTimeString('zh-TW')}</span>
      ${canEdit ? `<button class="btn btn-outline btn-sm btn-edit-item" data-scan-id="${item.scanId}" style="padding:6px 10px">✎</button>` : ''}
      ${canEdit ? `<button class="btn btn-danger btn-sm btn-delete-item" data-scan-id="${item.scanId}" style="padding:6px 10px">✕</button>` : ''}
    `;
    list.appendChild(li);
  }

  // Bind edit buttons
  list.querySelectorAll('.btn-edit-item').forEach(btn => {
    btn.addEventListener('click', () => {
      showEditItemDialog(box.id, btn.dataset.scanId);
    });
  });

  // Bind delete buttons
  list.querySelectorAll('.btn-delete-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const scanId = btn.dataset.scanId;
      BoxManager.removeItem(box.id, scanId);
      showToast('已刪除條目', '');
      renderScanList();
    });
  });
}

function renderStats() {
  const tbody = document.getElementById('stats-tbody');
  const summary = document.getElementById('stats-summary');

  if (state.boxes.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="stats-empty">尚無盤點資料</td></tr>';
    summary.textContent = '';
    return;
  }

  const aggItems = AggregationEngine.aggregate(state.boxes);
  const totalItems = aggItems.reduce((s, a) => s + a.totalQty, 0);
  const closedBoxes = state.boxes.filter(b => b.status === 'closed').length;
  summary.textContent = `共 ${state.boxes.length} 箱（已完成 ${closedBoxes} 箱）、${aggItems.length} 種商品、${totalItems} 筆掃描`;

  if (aggItems.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="stats-empty">尚無掃描記錄</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  aggItems.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td class="mono">${escHtml(item.barcode)}</td>
      <td>${escHtml(item.productName) || '—'}</td>
      <td>${escHtml(item.gender) || '—'}</td>
      <td>${escHtml(item.color) || '—'}</td>
      <td>${escHtml(item.size) || '—'}</td>
      <td class="qty">${item.totalQty}</td>
      <td>${item.boxes.map(escHtml).join(', ')}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ========== Dialog ==========
function showDialog(title, message, onConfirm) {
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.innerHTML = `
    <div class="dialog">
      <h3>${escHtml(title)}</h3>
      <p>${escHtml(message)}</p>
      <div class="dialog-actions">
        <button class="btn btn-outline btn-sm dialog-cancel">取消</button>
        <button class="btn btn-primary btn-sm dialog-confirm">確認</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('.dialog-cancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('.dialog-confirm').addEventListener('click', () => {
    backdrop.remove();
    onConfirm();
  });
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
}

function confirmClearAll() {
  showDialog('清除所有資料', '確定要清除所有盤點資料嗎？此操作無法復原。', () => {
    CameraEngine.stop(document.getElementById('camera-video'));
    resetScannerUI();
    Store.clearState();
    state = { boxes: [], currentBoxId: null, lastBoxSeq: 0, productCache: {} };
    showToast('資料已清除', '');
    renderAll();
    renderStats();
  });
}

// ========== Helpers ==========
function escHtml(s) {
  if (!s) return '';
  // 同時跳脫引號：這個函式也用在 value="…" 這類屬性值裡，品名或顏色含 " 或 ' 時才不會截斷欄位或注入屬性。
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ========== UserBar (頂端使用者列：GET /api/me → 「👤 姓名（角色）」、我的帳號、設定（管理員）、登出) ==========
const UserBar = {
  ROLE_LABELS: { admin: '管理員', user: '一般使用者' },

  async init() {
    try {
      const resp = await ApiClient.get('/api/me');
      if (!resp.ok) return; // 401 已由 ApiClient 導向登入頁
      const result = await resp.json();
      const me = result && result.data;
      if (!me || typeof me.name !== 'string') return;
      document.getElementById('userbar-user').textContent = '👤 ' + me.name + '（' + (this.ROLE_LABELS[me.role] || me.role) + '）';
      document.getElementById('userbar-settings').hidden = me.role !== 'admin';
      document.getElementById('userbar').hidden = false;
    } catch (e) {
      console.error('讀取登入者資訊失敗:', e);
    }
  },

  async logout() {
    try { await ApiClient.post('/logout', {}); } catch (e) { console.error('登出失敗:', e); }
    location.href = '/login';
  }
};
document.getElementById('userbar-logout').addEventListener('click', () => UserBar.logout());
UserBar.init();

// ========== Init ==========
renderAll();

// Fix lastBoxSeq from existing boxes
if (state.boxes.length > 0) {
  for (const box of state.boxes) {
    const m = box.id.match(/^BOX-(\d+)$/);
    if (m) {
      const n = parseInt(m[1], 10);
      if (n > state.lastBoxSeq) state.lastBoxSeq = n;
    }
  }
  persist();
}
</script>
