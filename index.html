}

/** 拿到商品編號後的唯一入口（拍照與手動輸入共用）：同箱已有就累加、查總表、查無／查詢失敗才跳視窗讓人員手動輸入。 */
async function scanBarcode(barcode) {
  const box = BoxManager.getCurrentBox();
  if (!box || box.status === 'closed') {
    showToast('請先建立或選擇一個開放中的箱號', 'error');
    return;
  }
  if (ProductFlow._busy) {
    showToast('正在處理上一筆，請稍候', '');
    return;
  }
  const qty = readScanQty();
  const manualBtn = document.getElementById('btn-add-manual');
  const deps = {
    box,
    api: ApiClient,
    cache: () => state.productCache,
    isBoxOpen: b => b.status === 'open' && state.boxes.includes(b),
    addItem: (boxId, code, info) => BoxManager.addItem(boxId, code, info),
    persist,
    askBarcode: () => askBarcodeDialog(),
    askProduct: opts => askProductDialog(opts),
    notify: showToast
  };
  let result;
  manualBtn.disabled = true;
  try {
    result = await ProductFlow.run({ barcode, qty }, deps);
  } catch (e) {
    console.error('加入商品失敗:', e);
    showToast('加入商品時發生錯誤：' + e.message, 'error');
    return;
  } finally {
    const current = BoxManager.getCurrentBox();
    manualBtn.disabled = !(current && current.status === 'open');
  }
  if (result.status === 'closed') {
    showToast('此箱已完成或已刪除，未加入', 'error');
    return;
  }
  if (result.status !== 'added' && result.status !== 'merged') return;
  document.getElementById('input-scan-qty').value = 1; // 成功加入後重設回 1，避免下一件誤加整批數量
  try { navigator.vibrate?.(100); } catch(e) {}
  if (result.status === 'merged') {
    showToast(`已累加：${result.item.barcode}，本箱共 ${result.item.qty} 件${result.capped ? '（已達上限 9999）' : ''}`, 'success');
  } else {
    showToast('已加入：' + result.item.barcode + (result.item.qty > 1 ? ' ×' + result.item.qty : ''), 'success');
  }
  renderBoxTabs();
  renderScanList();
}

function genderOptions(selected) {
  return ['男', '女', '中性'].map(g => `<option value="${g}"${selected === g ? ' selected' : ''}>${g}</option>`).join('');
}

/** OCR 沒讀到編號時：請人員輸入商品編號。回傳編號（Promise），取消回 null。 */
function askBarcodeDialog() {
  return new Promise(resolve => {
    const backdrop = document.createElement('div');
    backdrop.className = 'dialog-backdrop';
    backdrop.innerHTML = `
      <div class="dialog">
        <h3>沒有讀到商品編號</h3>
        <p>請輸入商品編號，確認後會到商品總表查詢品名。</p>
        <div class="dialog-form">
          <input type="text" id="dlg-barcode-only" placeholder="商品編號" style="font-family:'SF Mono','Fira Code',monospace">
        </div>
        <div class="dialog-actions">
          <button class="btn btn-outline btn-sm dialog-cancel">取消</button>
          <button class="btn btn-primary btn-sm dialog-confirm">確認</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector('#dlg-barcode-only');
    setTimeout(() => input.focus(), 100);
    const finish = value => { backdrop.remove(); resolve(value); };
    const confirm = () => {
      const value = input.value.trim();
      if (!value) { showToast('商品編號不可為空', 'error'); return; }
      finish(value);
    };
    backdrop.querySelector('.dialog-cancel').addEventListener('click', () => finish(null));
    backdrop.querySelector('.dialog-confirm').addEventListener('click', confirm);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') confirm(); });
    backdrop.addEventListener('click', e => { if (e.target === backdrop) finish(null); });
  });
}

/**
 * 總表查無（reason 'missing'）或無法查詢商品總表（'unverified'）時的手動輸入視窗。
 * 商品編號可以改（確認時會用新編號再查一次）；回傳 { barcode, info, qty }（Promise），取消回 null。
 */
function askProductDialog({ barcode, reason, prefill, qty }) {
  return new Promise(resolve => {
    const info = prefill || {};
    const missing = reason === 'missing';
    const backdrop = document.createElement('div');
    backdrop.className = 'dialog-backdrop';
    backdrop.innerHTML = `
      <div class="dialog dialog-wide">
        <h3>${missing ? '總表查無此商品' : '無法查詢商品總表'}</h3>
        <div class="dialog-alert ${missing ? 'dialog-alert-danger' : 'dialog-alert-warning'}" role="alert">
          ${missing
            ? '<strong>總表查無</strong>：請先核對商品編號，再手動輸入品名。商品編號改了會重新查詢總表。'
            : '<strong>無法查詢商品總表</strong>（連線或系統問題）：請手動輸入品名，這一筆會標記為「未核對」。'}
        </div>
        <div class="dialog-form">
          <div>
            <label>商品編號</label>
            <input type="text" id="dlg-barcode" value="${escHtml(barcode || '')}" placeholder="條碼編號" style="font-family:'SF Mono','Fira Code',monospace">
          </div>
          <div>
            <label>品名</label>
            <input type="text" id="dlg-product-name" value="${escHtml(info.productName || '')}" placeholder="例：第五代溫灸刷毛圓領發熱衣">
          </div>
          <div class="form-row">
            <div>
              <label>性別</label>
              <select id="dlg-gender">
                <option value="">請選擇</option>
                ${genderOptions(info.gender)}
              </select>
            </div>
            <div>
              <label>顏色</label>
              <input type="text" id="dlg-color" value="${escHtml(info.color || '')}" placeholder="例：經典黑">
            </div>
          </div>
          <div class="form-row">
            <div>
              <label>尺寸</label>
              <input type="text" id="dlg-size" value="${escHtml(info.size || '')}" placeholder="例：L、XL、XXL">
            </div>
            <div>
              <label>數量</label>
              <input type="number" id="dlg-qty" value="${escHtml(String(ProductFlow.clampQty(qty)))}" min="1" max="9999" step="1" style="text-align:center">
            </div>
          </div>
        </div>
        <div class="dialog-actions">
          <button class="btn btn-outline btn-sm dialog-cancel">取消</button>
          <button class="btn btn-primary btn-sm dialog-confirm">確認</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    setTimeout(() => backdrop.querySelector(barcode ? '#dlg-product-name' : '#dlg-barcode').focus(), 100);
    const finish = value => { backdrop.remove(); resolve(value); };
    backdrop.querySelector('.dialog-cancel').addEventListener('click', () => finish(null));
    backdrop.querySelector('.dialog-confirm').addEventListener('click', () => {
      const confirmedBarcode = backdrop.querySelector('#dlg-barcode').value.trim();
      if (!confirmedBarcode) { showToast('商品編號不可為空', 'error'); return; }
      finish({
        barcode: confirmedBarcode,
        info: {
          productName: backdrop.querySelector('#dlg-product-name').value.trim(),
          gender: backdrop.querySelector('#dlg-gender').value,
          color: backdrop.querySelector('#dlg-color').value.trim(),
          size: backdrop.querySelector('#dlg-size').value.trim()
        },
        qty: ProductFlow.clampQty(backdrop.querySelector('#dlg-qty').value)
      });
    });
    backdrop.addEventListener('click', e => { if (e.target === backdrop) finish(null); });
  });
}

            <label>數量</label>
            <input type="number" id="edit-qty" value="${qty}" min="1" max="9999" style="text-align:center">

        </div>

      <div class="dialog-actions">
        <button class="btn btn-outline btn-sm dialog-cancel">取消</button>
        <button class="btn btn-primary btn-sm dialog-confirm">儲存</button>

  `;

function renderAll() {
  renderBoxTabs();
  renderCurrentBox();

}

function renderBoxTabs() {
  const container = document.getElementById('box-tabs');
  container.innerHTML = '';
  for (const box of state.boxes) {
    const wrapper = document.createElement('div');
    wrapper.className = 'box-tab-wrapper' + (state.currentBoxId === box.id ? ' active' : '');

    const tab = document.createElement('div');
    tab.className = 'box-tab' +
      (state.currentBoxId === box.id ? ' active' : '') +
      (box.status === 'closed' ? ' closed' : '');
    const boxTotalQty = box.items.reduce((s, i) => s + (i.qty || 1), 0);
    tab.textContent = box.id + (box.status === 'closed' ? ' ✓' : ` (${boxTotalQty})`);
    tab.addEventListener('click', () => {
      state.currentBoxId = box.id;
      persist();
      renderAll();
    });
    wrapper.appendChild(tab);

    const actions = document.createElement('div');
    actions.className = 'box-tab-actions';

    // Edit button
    const editBtn = document.createElement('button');
    editBtn.className = 'box-action-btn';
    editBtn.title = '編輯箱號';
    editBtn.textContent = '✎';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startEditBox(box.id, wrapper, tab);
    });
    actions.appendChild(editBtn);

    // 列印外箱明細（只預設勾這一箱）
    const outerBtn = document.createElement('button');
    outerBtn.className = 'box-action-btn';
    outerBtn.title = '列印外箱明細';
    outerBtn.setAttribute('aria-label', '列印外箱明細：' + box.id);
    outerBtn.textContent = '🖨';
    outerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showOuterBoxDialog('box', box.id);
    });
    actions.appendChild(outerBtn);

    // Delete button
    const delBtn = document.createElement('button');
    delBtn.className = 'box-action-btn delete';
    delBtn.title = '刪除箱號';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const itemCount = box.items.length;
      const msg = itemCount > 0
        ? `確定要刪除箱號 ${box.id} 嗎？箱內有 ${itemCount} 筆掃描記錄將一併刪除。`
        : `確定要刪除箱號 ${box.id} 嗎？`;
      showDialog('刪除箱號', msg, () => {
        if (state.currentBoxId === box.id) {
          CameraEngine.stop(document.getElementById('camera-video'));
          resetScannerUI();
        }
        BoxManager.deleteBox(box.id);
        showToast('已刪除箱號：' + box.id, '');
        renderAll();
      });
    });
    actions.appendChild(delBtn);

    wrapper.appendChild(actions);
    container.appendChild(wrapper);
  }
}

function startEditBox(boxId, wrapper, tabEl) {
  const input = document.createElement('input');
  input.className = 'box-edit-input';
  input.value = boxId;
  input.maxLength = 20;

  tabEl.style.display = 'none';
  const actions = wrapper.querySelector('.box-tab-actions');
  if (actions) actions.style.display = 'none';
  wrapper.insertBefore(input, tabEl);
  input.focus();
  input.select();

  function finish() {
    const newId = input.value.trim();
    if (newId && newId !== boxId) {
      if (BoxManager.renameBox(boxId, newId)) {
        showToast(`箱號已更名：${boxId} → ${newId}`, 'success');
      }
    }
    renderAll();
  }
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = boxId; input.blur(); }
  });
}

function renderCurrentBox() {
  const banner = document.getElementById('current-box-banner');
  const scannerCard = document.getElementById('scanner-card');
  const itemListCard = document.getElementById('item-list-card');
  const box = BoxManager.getCurrentBox();

  // 掃描卡片一直顯示；沒有開放中的箱號時停用控制項、把提示換成「請先新增箱號」（各控制項自己也再擋一次）
  scannerCard.style.display = '';

  if (!box) {
    banner.style.display = 'none';
    itemListCard.style.display = 'none';
    CameraEngine.stop(document.getElementById('camera-video'));
    resetScannerUI();
    setScannerEnabled(false, '請先新增箱號');
    return;
  }

  banner.style.display = '';
  document.getElementById('current-box-id').textContent = box.id;
  const statusEl = document.getElementById('current-box-status');
  if (box.status === 'open') {
    statusEl.textContent = '開放中';
    statusEl.className = 'box-status status-open';
    document.getElementById('btn-close-box').style.display = '';
    setScannerEnabled(true, '點擊下方按鈕開啟相機');
  } else {
    statusEl.textContent = '已完成';
    statusEl.className = 'box-status status-closed';
    document.getElementById('btn-close-box').style.display = 'none';
    CameraEngine.stop(document.getElementById('camera-video'));
    resetScannerUI();
    setScannerEnabled(false, '此箱已完成，請新增箱號或切換到開放中的箱號');
  }
  itemListCard.style.display = '';
}

/** 掃描卡片的可用狀態：enabled=false 時停用「開啟相機」與手動輸入，並把相機區的提示文字換成 hint。 */
function setScannerEnabled(enabled, hint) {
  const hintEl = document.getElementById('scanner-hint');
  hintEl.textContent = hint;
  hintEl.classList.toggle('hint-blocked', !enabled);
  document.getElementById('btn-start-scan').disabled = !enabled;
  document.getElementById('btn-add-manual').disabled = !enabled;
  document.getElementById('input-manual-barcode').disabled = !enabled;
  document.getElementById('input-scan-qty').disabled = !enabled;
}

function resetScannerUI() {
  const videoEl = document.getElementById('camera-video');
  CameraEngine.stop(videoEl);
  videoEl.style.display = 'none';
  document.getElementById('scanner-placeholder').style.display = '';
  document.getElementById('btn-start-scan').style.display = '';
  document.getElementById('btn-stop-scan').style.display = 'none';
  document.getElementById('btn-capture').style.display = 'none';
  document.getElementById('ocr-status').style.display = 'none';
}

function renderScanList() {
  const box = BoxManager.getCurrentBox();
  const list = document.getElementById('scan-list');
  const count = document.getElementById('item-count');

  if (!box || box.items.length === 0) {
    list.innerHTML = '<li class="empty">尚無掃描記錄</li>';
    count.textContent = '0';
    return;
  }

  const totalQty = box.items.reduce((s, i) => s + (i.qty || 1), 0);
  count.textContent = totalQty;
  list.innerHTML = '';

  // Show in reverse order (newest first)
  for (let i = box.items.length - 1; i >= 0; i--) {
    const item = box.items[i];
    const li = document.createElement('li');
    const canEdit = box.status === 'open';
    const itemQty = item.qty || 1;
    const details = [item.gender, item.color, item.size].filter(Boolean);
    const catalogTag = item.catalog === 'missing' ? '<span class="scan-tag scan-tag-missing">總表查無</span>'
      : item.catalog === 'unverified' ? '<span class="scan-tag scan-tag-unverified">未核對</span>' : '';
    li.innerHTML = `
      <div class="scan-item-info">
        <div class="scan-item-barcode">${escHtml(item.barcode)}${!canEdit && itemQty > 1 ? ` <span style="color:var(--primary-dark);font-size:.82rem">×${itemQty}</span>` : ''}${catalogTag}</div>
        ${item.productName ? `<div class="scan-item-name">${escHtml(item.productName)}</div>` : ''}
        ${details.length ? `<div class="scan-item-detail">${details.map(d => `<span>${escHtml(d)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="scan-item-controls">
      <span class="scan-item-time">${new Date(item.scannedAt).toLocaleTimeString('zh-TW')}</span>
      ${canEdit ? `<label class="item-qty-label">數量 <input type="number" class="item-qty-input" data-scan-id="${escHtml(item.scanId)}" value="${itemQty}" min="1" max="9999" step="1" inputmode="numeric"></label>` : ''}
      ${canEdit ? `<button class="btn btn-outline btn-sm btn-edit-item" data-scan-id="${item.scanId}" style="padding:6px 10px">✎</button>` : ''}
      ${canEdit ? `<button class="btn btn-danger btn-sm btn-delete-item" data-scan-id="${item.scanId}" style="padding:6px 10px">✕</button>` : ''}
      </div>
    `;
    list.appendChild(li);
  }

  // 直接在清單輸入數量（不必進編輯視窗）：一律修正成 1～9999 的整數
  list.querySelectorAll('.item-qty-input').forEach(input => {
    input.addEventListener('change', () => {
      BoxManager.updateItem(box.id, input.dataset.scanId, { qty: ProductFlow.clampQty(input.value) });
      renderBoxTabs();
      renderScanList();
    });
  });

  // Bind edit buttons
  list.querySelectorAll('.btn-edit-item').forEach(btn => {
    btn.addEventListener('click', () => {
      showEditItemDialog(box.id, btn.dataset.scanId);
    });
  });

  // Bind delete buttons
  list.querySelectorAll('.btn-delete-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const scanId = btn.dataset.scanId;
      BoxManager.removeItem(box.id, scanId);
      showToast('已刪除條目', '');
      renderBoxTabs();
      renderScanList();
    });
  });
}

function renderStats() {
  const tbody = document.getElementById('stats-tbody');
  const summary = document.getElementById('stats-summary');

  if (state.boxes.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="stats-empty">尚無盤點資料<div class="stats-empty-hint no-print">這裡只顯示這台裝置掃描的資料；要印別台裝置掃的箱子，請按「列印外箱明細」從商品主檔載入。</div></td></tr>';
    summary.textContent = '';
    return;
  }

  const aggItems = AggregationEngine.aggregate(state.boxes);
  const totalItems = aggItems.reduce((s, a) => s + a.totalQty, 0);
  const closedBoxes = state.boxes.filter(b => b.status === 'closed').length;
  summary.textContent = `共 ${state.boxes.length} 箱（已完成 ${closedBoxes} 箱）、${aggItems.length} 種商品、${totalItems} 筆掃描`;

  if (aggItems.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="stats-empty">尚無掃描記錄</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  aggItems.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td class="mono">${escHtml(item.barcode)}</td>
      <td>${escHtml(item.productName) || '—'}</td>
      <td>${escHtml(item.gender) || '—'}</td>
      <td>${escHtml(item.color) || '—'}</td>
      <td>${escHtml(item.size) || '—'}</td>
      <td class="qty">${item.totalQty}</td>
      <td>${item.boxes.map(escHtml).join(', ')}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ========== Dialog ==========
function showDialog(title, message, onConfirm) {
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.innerHTML = `
    <div class="dialog">
      <h3>${escHtml(title)}</h3>
      <p>${escHtml(message)}</p>
      <div class="dialog-actions">
        <button class="btn btn-outline btn-sm dialog-cancel">取消</button>
        <button class="btn btn-primary btn-sm dialog-confirm">確認</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('.dialog-cancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('.dialog-confirm').addEventListener('click', () => {
    backdrop.remove();
    onConfirm();
  });
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
}

function confirmClearAll() {
  showDialog('清除所有資料', '確定要清除所有盤點資料嗎？此操作無法復原。', () => {
    CameraEngine.stop(document.getElementById('camera-video'));
    resetScannerUI();
    Store.clearState();
    state = { boxes: [], currentBoxId: null, lastBoxSeq: 0, productCache: {} };
    showToast('資料已清除', '');
    renderAll();
    renderStats();
  });
}

document.getElementById('btn-reset-product-cache').addEventListener('click', () => {
  const count = Object.keys(state.productCache || {}).length;
  showDialog('重設品名記憶', `只清除系統記住的品名（${count} 筆），箱子與商品都不會刪除。`, () => {
    ProductFlow.resetCache(state);
    persist();
    showToast('品名記憶已重設', 'success');
  });
});

// ========== Outer Box Print Dialog ==========
/**
 * 列印外箱明細：選擇要印的箱子（空箱不能選；依勾選順序排版）→ 查官方品名 → 量高度分頁 → 列印。
 * 視窗隨時開得起來（本機沒有箱子也可以）；另可「從商品主檔載入」別台裝置已完成的箱子。
 * 載入的箱子只存在這個視窗的區域變數 sheetBoxes：不進箱子清單、不寫入任何儲存。
 */
function showOuterBoxDialog(mode, boxId) {
  const boxes = state.boxes;
  let order = OuterBoxLabel.defaultSelection(boxes, mode, boxId);
  let sheetBoxes = [];
  let sheetStatus = { kind: '', text: '' };
  let sheetLoading = false;
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.innerHTML = `
    <div class="dialog dialog-wide">
      <h3>列印外箱明細</h3>
      <p>A4 直式，一頁上下各一箱，中間有裁切虛線。依勾選順序排版（數字是順序）。</p>
      <div class="ob-sheet">
        <p class="ob-sheet-hint">從商品主檔載入：別台裝置掃的箱子，只有已按「完成此箱」並同步成功的才載得到。</p>
        <div class="ob-sheet-row">
          <input type="date" class="ob-sheet-date" aria-label="載入哪一天的箱子" value="${escHtml(OuterBoxLabel.taipeiToday(Date.now()))}">
          <button class="btn btn-outline btn-sm ob-sheet-load">載入</button>
        </div>
        <div class="ob-sheet-status" aria-live="polite"></div>
      </div>
      <div class="ob-pick-tools">
        <button class="btn btn-outline btn-sm" data-pick="all">全選</button>
        <button class="btn btn-outline btn-sm" data-pick="closed">只選已完成</button>
        <button class="btn btn-outline btn-sm" data-pick="none">全不選</button>
      </div>
      <div class="ob-pick-list"></div>
      <div class="dialog-actions">
        <button class="btn btn-outline btn-sm dialog-cancel">取消</button>
        <button class="btn btn-primary btn-sm dialog-confirm">列印</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const listEl = backdrop.querySelector('.ob-pick-list');
  const confirmBtn = backdrop.querySelector('.dialog-confirm');
  const dateEl = backdrop.querySelector('.ob-sheet-date');
  const loadBtn = backdrop.querySelector('.ob-sheet-load');
  const statusEl = backdrop.querySelector('.ob-sheet-status');

  // 清單 = 本機箱子 ＋ 從商品主檔載入的箱子；data-box-id 是勾選順序用的鍵（本機是箱號、載入的是 sheet:… 鍵）
  const renderList = () => {
    const localHtml = boxes.length === 0
      ? '<div class="ob-pick-empty">這台裝置沒有箱子</div>'
      : boxes.map((box, i) => {
        const selectable = OuterBoxLabel.isSelectable(box);
        const sum = OuterBoxLabel.summarize(box);
        return `<label class="ob-pick${selectable ? '' : ' disabled'}">
      <input type="checkbox" data-box-id="${escHtml(box.id)}" data-index="${i}"${selectable ? '' : ' disabled'}>
      <span class="ob-pick-id">${escHtml(box.id)}</span>
      <span class="ob-tag ${box.status === 'closed' ? 'ob-tag-closed' : 'ob-tag-open'}">${box.status === 'closed' ? '已完成' : '進行中'}</span>
      <span class="ob-pick-order"></span>
      <span class="ob-pick-meta">${selectable ? `${sum.kinds} 種商品、${sum.pieces} 件` : '空箱（不能列印）'}</span>
    </label>`;
      }).join('');
    const sheetHtml = sheetBoxes.map(box => {
      const sum = OuterBoxLabel.summarize(box);
      const time = OuterBoxLabel.formatClosedTime(box.closedAt);
      return `<label class="ob-pick">
      <input type="checkbox" data-box-id="${escHtml(box.key)}">
      <span class="ob-pick-id">${escHtml(box.id)}</span>
      <span class="ob-tag ob-tag-sheet">商品主檔</span>
      <span class="ob-pick-order"></span>
      <span class="ob-pick-meta">${time ? escHtml(time) + '　' : ''}${sum.kinds} 種商品、${sum.pieces} 件</span>
    </label>`;
    }).join('');
    listEl.innerHTML = localHtml + sheetHtml;
  };
  const refresh = () => {
    for (const cb of listEl.querySelectorAll('input[type="checkbox"]')) {
      const at = order.indexOf(cb.dataset.boxId);
      cb.checked = at >= 0;
      cb.parentElement.querySelector('.ob-pick-order').textContent = at >= 0 ? '#' + (at + 1) : '';
    }
    confirmBtn.disabled = order.length === 0;
    statusEl.textContent = sheetStatus.text;
    statusEl.classList.toggle('is-error', sheetStatus.kind === 'error');
    loadBtn.disabled = sheetLoading;
    loadBtn.textContent = sheetLoading ? '載入中…' : '載入';
  };
  listEl.addEventListener('change', e => {
    const cb = e.target;
    if (!cb || !cb.dataset || cb.dataset.boxId === undefined) return;
    order = OuterBoxLabel.toggleOrder(order, cb.dataset.boxId, cb.checked);
    refresh();
  });
  backdrop.querySelectorAll('[data-pick]').forEach(btn => btn.addEventListener('click', () => {
    const pick = btn.dataset.pick;
    order = pick === 'none' ? [] : OuterBoxLabel.pickAll(boxes, sheetBoxes, pick);
    refresh();
  }));
  loadBtn.addEventListener('click', async () => {
    const date = dateEl.value;
    if (!date) {
      sheetStatus = { kind: 'error', text: '請先選擇日期' };
      refresh();
      return;
    }
    sheetLoading = true;
    sheetStatus = { kind: '', text: '' };
    refresh();
    const result = await OuterBoxLabel.fetchSheetBoxes(ApiClient, date);
    sheetLoading = false;
    if (!result.ok) {
      sheetStatus = { kind: 'error', text: result.error };
    } else {
      // 取代先前載入的那一批：舊的從勾選順序拿掉，本機箱子的勾選不動；新載入的預設不勾
      order = OuterBoxLabel.dropKeys(order, sheetBoxes.map(b => b.key));
      sheetBoxes = result.boxes;
      renderList();
      sheetStatus = sheetBoxes.length === 0
        ? { kind: '', text: '這一天在商品主檔沒有已完成的箱子' }
        : { kind: '', text: `已載入 ${sheetBoxes.length} 箱` };
    }
    refresh();
  });
  renderList();
  refresh();
  backdrop.querySelector('.dialog-cancel').addEventListener('click', () => backdrop.remove());
  confirmBtn.addEventListener('click', async () => {
    const chosen = OuterBoxLabel.resolveOrder(order, state.boxes, sheetBoxes);
    if (chosen.length === 0) return;
    confirmBtn.disabled = true;
    confirmBtn.textContent = '準備中…';
    try {
      await printOuterBoxes(chosen);
      backdrop.remove();
    } catch (e) {
      console.error('列印外箱明細失敗:', e);
      showToast('列印外箱明細失敗：' + e.message, 'error');
      confirmBtn.disabled = false;
      confirmBtn.textContent = '列印';
    }
  });
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
}

/** chosen: OuterBoxLabel.resolveOrder 的結果（本機箱子與載入的箱子，依勾選順序）。 */
async function printOuterBoxes(chosen) {
  const lookup = codes => ProductFlow.lookup(ApiClient, codes);
  const locals = chosen.filter(c => c.kind === 'local').map(c => c.box);
  const sheets = chosen.filter(c => c.kind === 'sheet').map(c => c.box);
  const [localPrepared, sheetPrepared] = await Promise.all([
    locals.length > 0 ? OuterBoxLabel.prepare(locals, { lookup }) : { boxes: [], lookupFailed: false },
    sheets.length > 0 ? OuterBoxLabel.prepareSheet(sheets, { lookup }) : { boxes: [], lookupFailed: false }
  ]);
  if (localPrepared.lookupFailed) showToast('無法查詢官方品名，舊商品改用現有品名列印', 'error');
  if (sheetPrepared.lookupFailed) showToast('無法查詢官方品名，商品主檔載入的箱子改用試算表上的品名列印', 'error');
  const merged = OuterBoxLabel.mergePrepared(chosen, localPrepared.boxes, sheetPrepared.boxes);
  const measured = OuterBoxLabel.measure(document, merged, escHtml);
  const pages = OuterBoxLabel.paginate(measured.boxes, measured.limits);
  PrintManager.printOuterBoxes(OuterBoxLabel.renderPages(pages, escHtml));
}

// ========== Helpers ==========
function escHtml(s) {
  if (!s) return '';
  // 同時跳脫引號：這個函式也用在 value="…" 這類屬性值裡，品名或顏色含 " 或 ' 時才不會截斷欄位或注入屬性。
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ========== UserBar (頂端使用者列：GET /api/me → 「👤 姓名（角色）」、我的帳號、設定（管理員）、登出) ==========
const UserBar = {
  ROLE_LABELS: { admin: '管理員', user: '一般使用者' },

  async init() {
    try {
      const resp = await ApiClient.get('/api/me');
      if (!resp.ok) return; // 401 已由 ApiClient 導向登入頁
      const result = await resp.json();
      const me = result && result.data;
      if (!me || typeof me.name !== 'string') return;
      document.getElementById('userbar-user').textContent = '👤 ' + me.name + '（' + (this.ROLE_LABELS[me.role] || me.role) + '）';
      document.getElementById('userbar-settings').hidden = me.role !== 'admin';
      document.getElementById('userbar').hidden = false;
    } catch (e) {
      console.error('讀取登入者資訊失敗:', e);
    }
  },

  async logout() {
    try { await ApiClient.post('/logout', {}); } catch (e) { console.error('登出失敗:', e); }
    location.href = '/login';
  }
};
document.getElementById('userbar-logout').addEventListener('click', () => UserBar.logout());
UserBar.init();

// ========== Init ==========
renderAll();

// Fix lastBoxSeq from existing boxes
if (state.boxes.length > 0) {
  for (const box of state.boxes) {
    const m = box.id.match(/^BOX-(\d+)$/);
    if (m) {
      const n = parseInt(m[1], 10);
      if (n > state.lastBoxSeq) state.lastBoxSeq = n;
    }
  }
  persist();
}
</script>
