<!DOCTYPE html>
<html lang="zh-Hant" data-thermal="warm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPAS 庫存盤點裝箱系統</title>
<link rel="stylesheet" href="/assets/wiwi-colors.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ===== 顏色：全部來自 /assets/wiwi-colors.css 的 --wiwi-* 語意 token =====
   整站 html 元素帶 data-thermal="warm"（溫感橘，官網預設）。這個檔案裡不寫任何色碼或 rgb()：要半透明就用 color-mix() 從 token 調出來
   （tests/branding.test.ts 會擋）。鐵律：
   - 橘（--wiwi-thermal-fill）與藍綠只當底色、圖形，不當字，也不壓白字（2.28:1）；底在橘上的字用 --wiwi-thermal-on-fill。
   - 品牌文字一律 --wiwi-thermal-text-strong（這一頁的底都不是純白，accent 只給純白底）。
   - 互動控制項（輸入框、按鈕、分頁）的邊框用 --wiwi-border-strong（>= 3:1）；卡片、分隔線這類裝飾才用 --wiwi-border。
   - 次要文字用 --wiwi-text-muted（6.10:1）；--wiwi-text-subtle（3.45:1）不當內文。
   - 主要按鈕 = --wiwi-thermal-solid 底 + --wiwi-thermal-on-solid 字；狀態色只用「狀態色字 + 各自的 -tint 底」。
   舊的變數名稱保留（JS 產生的 HTML 裡有 var(--primary-dark)、var(--text-muted) 之類的用法），但全部改成指向 token。 */
:root {
  --primary: var(--wiwi-thermal-solid);            /* 主要按鈕底：白字 4.75:1 */
  --primary-dark: var(--wiwi-thermal-text-strong); /* 非純白底上的品牌文字（淡底 5.87:1、灰底 6.07:1） */
  --bg: var(--wiwi-surface-sunken);
  --card-solid: var(--wiwi-surface);
  --text: var(--wiwi-text);
  --text-muted: var(--wiwi-text-muted);
  --border-subtle: var(--wiwi-border);
  --radius: 16px;
  --radius-sm: 10px;
  /* 玻璃擬態與陰影：預設是不透明的 token；瀏覽器支援 color-mix() 才改成半透明（見下面的 @supports） */
  --card: var(--wiwi-surface);
  --glass-bg: var(--wiwi-surface);
  --glass-bg-strong: var(--wiwi-surface);
  --glass-border: var(--wiwi-border);
  --shadow-soft: var(--wiwi-border);
  --shadow-lift: var(--wiwi-border);
  --highlight: var(--wiwi-surface);
  --primary-glow: var(--wiwi-border);
  --glass-shadow: 0 8px 32px var(--shadow-soft);
  --neu-shadow-sm: 3px 3px 8px var(--shadow-soft), -2px -2px 6px var(--highlight);
  --neu-inset: inset 2px 2px 5px var(--shadow-soft), inset -2px -2px 5px var(--highlight);
}
@supports (color: color-mix(in srgb, red 50%, transparent)) {
  :root {
    --card: color-mix(in srgb, var(--wiwi-surface) 78%, transparent);
    --glass-bg: color-mix(in srgb, var(--wiwi-surface) 70%, transparent);
    --glass-bg-strong: color-mix(in srgb, var(--wiwi-surface) 92%, transparent);
    --glass-border: color-mix(in srgb, var(--wiwi-surface) 60%, var(--wiwi-border));
    --shadow-soft: color-mix(in srgb, var(--wiwi-text) 8%, transparent);
    --shadow-lift: color-mix(in srgb, var(--wiwi-text) 14%, transparent);
    --highlight: color-mix(in srgb, var(--wiwi-surface) 80%, transparent);
    --primary-glow: color-mix(in srgb, var(--wiwi-thermal-solid) 28%, transparent);
  }
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 15% 10%, var(--wiwi-thermal-tint) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, var(--wiwi-thermal-tint) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
  min-height: 100dvh;
}
::placeholder { color: var(--text-muted); opacity: 1; }
:focus-visible { outline: 3px solid var(--wiwi-focus-ring); outline-offset: 2px; }

/* ===== Header — 白底（Logo 的橘與藍綠要在淺底上才看得見）＋品牌橘底線 ===== */
.header {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  color: var(--text);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 3px solid var(--wiwi-thermal-border);
}
.brand-logo { display: block; flex: none; height: 48px; width: auto; }
.header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: .3px;
  margin-right: auto;
}
.header-actions { display: flex; gap: 8px; }

/* ===== 使用者列：登入者、我的帳號、設定（管理員）、登出 ===== */
.userbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 4px 14px;
  padding: 6px 16px;
  font-size: .82rem;
  color: var(--text-muted);
  background: var(--wiwi-surface-sunken);
  border-bottom: 1px solid var(--border-subtle);
}
.userbar[hidden], .userbar a[hidden] { display: none; }
.userbar #userbar-user { font-weight: 600; color: var(--text); }
.userbar a { color: var(--primary-dark); font-weight: 600; text-decoration: none; }
.userbar a:hover { text-decoration: underline; }
.userbar button {
  border: 1px solid var(--wiwi-border-strong);
  background: var(--card-solid);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 3px 12px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
}

/* ===== Buttons — Soft UI ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s ease;
  white-space: nowrap;
  letter-spacing: .2px;
}
.btn:active { transform: scale(.96); }
/* 主要按鈕：實心深橘 + 白字（4.75:1；hover／active 換更深的 solid） */
.btn-primary {
  background: var(--wiwi-thermal-solid);
  color: var(--wiwi-thermal-on-solid);
  box-shadow: 0 4px 14px var(--primary-glow);
}
.btn-primary:hover {
  background: var(--wiwi-thermal-solid-hover);
  box-shadow: 0 6px 20px var(--primary-glow);
  transform: translateY(-1px);
}
.btn-primary:active { background: var(--wiwi-thermal-solid-active); }
/* 危險／成功：狀態色字 + 各自的淡底 + 同色邊框；hover 反過來（淡底字壓在狀態色上，同一組對比） */
.btn-danger {
  background: var(--wiwi-danger-tint);
  color: var(--wiwi-danger);
  border-color: var(--wiwi-danger);
}
.btn-danger:hover { background: var(--wiwi-danger); color: var(--wiwi-danger-tint); transform: translateY(-1px); }
.btn-success {
  background: var(--wiwi-success-tint);
  color: var(--wiwi-success);
  border-color: var(--wiwi-success);
}
.btn-success:hover { background: var(--wiwi-success); color: var(--wiwi-success-tint); transform: translateY(-1px); }
.btn-outline {
  background: var(--glass-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--wiwi-border-strong);
  color: var(--text);
}
.btn-outline:hover { background: var(--wiwi-thermal-tint); }
.btn-sm { padding: 7px 14px; font-size: .82rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* ===== Cards — Glass + Neumorphism ===== */
.card {
  background: var(--card);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--glass-shadow);
  padding: 22px;
  margin-bottom: 16px;
  transition: box-shadow .25s ease;
}
.card:hover { box-shadow: 0 10px 40px var(--shadow-lift); }
.card-title {
  font-size: .95rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  letter-spacing: .2px;
}

/* Main layout */
.main { max-width: 920px; margin: 0 auto; padding: 20px 16px; }

/* ===== Inputs — 邊框用 border-strong（互動控制項 >= 3:1） ===== */
.box-create-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.box-create-row input,
.manual-input-row input {
  flex: 1;
  min-width: 140px;
  padding: 11px 16px;
  border: 1px solid var(--wiwi-border-strong);
  border-radius: var(--radius-sm);
  font-size: 16px;
  background: var(--wiwi-surface);
  box-shadow: var(--neu-inset);
  transition: all .2s;
  color: var(--text);
}
.box-create-row input:focus,
.manual-input-row input:focus {
  border-color: var(--wiwi-focus-ring);
  box-shadow: var(--neu-inset), 0 0 0 3px var(--primary-glow);
}
.manual-input-row input { font-family: 'SF Mono', 'Fira Code', monospace; }

/* ===== Current box banner — 品牌淡底 ===== */
.current-box-banner {
  background: var(--wiwi-thermal-tint);
  color: var(--text);
  border: 1px solid var(--wiwi-thermal-border);
  border-radius: var(--radius);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.current-box-banner .box-id {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary-dark);
}
.current-box-banner .box-status {
  font-size: .78rem;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 600;
  letter-spacing: .3px;
  text-transform: uppercase;
}
.status-open {
  background: var(--wiwi-success-tint);
  color: var(--wiwi-success);
  border: 1px solid var(--wiwi-success);
}
.status-closed {
  background: var(--wiwi-surface-sunken);
  color: var(--text-muted);
  border: 1px solid var(--wiwi-border-strong);
}

/* ===== Scanner ===== */
.scanner-area {
  position: relative;
  background: var(--wiwi-surface-sunken);
  border: 2px dashed var(--wiwi-border-strong);
  border-radius: var(--radius-sm);
  overflow: hidden;
  aspect-ratio: 4/3;
  max-height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.scanner-area video { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
.btn-capture {
  background: var(--wiwi-thermal-solid);
  color: var(--wiwi-thermal-on-solid);
  font-size: 1rem;
  font-weight: 700;
  padding: 14px 28px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  width: 100%;
  box-shadow: 0 4px 14px var(--primary-glow);
}
.btn-capture:hover { background: var(--wiwi-thermal-solid-hover); }
.btn-capture:active { background: var(--wiwi-thermal-solid-active); }
.btn-capture:disabled { opacity: .5; cursor: not-allowed; }
.scanner-placeholder {
  color: var(--text-muted);
  text-align: center;
  padding: 40px 20px;
}
.scanner-placeholder .icon {
  font-size: 2.2rem;
  margin-bottom: 10px;
}
.scanner-placeholder .hint-blocked { font-weight: 600; }
.manual-input-row input:disabled { opacity: .5; cursor: not-allowed; }

/* ===== Scan list ===== */
.scan-list { list-style: none; }
.scan-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 12px;
  margin-bottom: 6px;
  border-radius: var(--radius-sm);
  background: var(--glass-bg);
  box-shadow: var(--neu-shadow-sm);
  gap: 6px 10px;
  flex-wrap: wrap;
  transition: all .15s;
}
.scan-list li:hover { background: var(--wiwi-thermal-tint); }
.scan-item-info { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
.scan-item-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
.scan-item-barcode {
  font-weight: 700;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: .9rem;
  color: var(--text);
}
.scan-item-name { color: var(--text-muted); font-size: .82rem; margin-top: 1px; }
.scan-item-detail { color: var(--text-muted); font-size: .78rem; margin-top: 1px; display: flex; gap: 6px; flex-wrap: wrap; }
.scan-item-detail span { background: var(--wiwi-thermal-tint); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.scan-item-time { color: var(--text-muted); font-size: .78rem; white-space: nowrap; }
.scan-list .empty {
  color: var(--text-muted);
  text-align: center;
  padding: 28px;
  background: none;
  box-shadow: none;
}

/* ===== Box tabs — Soft pills ===== */
.box-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.box-tab {
  padding: 7px 16px;
  border-radius: 24px;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--wiwi-border-strong);
  background: var(--wiwi-surface);
  box-shadow: var(--neu-shadow-sm);
  transition: all .2s;
  color: var(--text);
}
.box-tab:hover { background: var(--wiwi-thermal-tint); }
.box-tab.closed { background: var(--wiwi-surface-sunken); color: var(--text-muted); }
.box-tab.active {
  background: var(--wiwi-thermal-fill);
  color: var(--wiwi-thermal-on-fill);
  border-color: var(--wiwi-thermal-solid); /* 橘 fill 對白底只有 2.2:1，選取狀態的邊界用深橘（4.75:1） */
  box-shadow: 0 4px 14px var(--primary-glow);
}
.box-tab-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  position: relative;
}
.box-tab-actions {
  display: none;
  gap: 3px;
  margin-left: 4px;
}
.box-tab-wrapper:hover .box-tab-actions,
.box-tab-wrapper.active .box-tab-actions { display: inline-flex; }
.box-action-btn {
  width: 22px;
  height: 22px;
  border: 1px solid var(--wiwi-border-strong);
  border-radius: 50%;
  font-size: .68rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--wiwi-surface-sunken);
  color: var(--text-muted);
  transition: all .2s;
  padding: 0;
  line-height: 1;
}
.box-action-btn:hover { background: var(--wiwi-thermal-tint); color: var(--primary-dark); }
.box-action-btn.delete:hover {
  background: var(--wiwi-danger);
  color: var(--wiwi-danger-tint);
  border-color: var(--wiwi-danger);
}

/* Inline edit input */
.box-edit-input {
  padding: 5px 10px;
  border: 2px solid var(--wiwi-thermal-solid);
  border-radius: 8px;
  font-size: .82rem;
  font-weight: 600;
  width: 120px;
  background: var(--wiwi-surface);
  color: var(--text);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

/* ===== Stats table — Clean minimal ===== */
.stats-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .88rem; }
.stats-table th {
  background: var(--wiwi-surface-sunken);
  text-align: left;
  padding: 11px 14px;
  font-weight: 700;
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
}
.stats-table th:first-child { border-radius: var(--radius-sm) 0 0 0; }
.stats-table th:last-child { border-radius: 0 var(--radius-sm) 0 0; }
.stats-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-subtle);
}
.stats-table tr:hover td { background: var(--wiwi-thermal-tint); }
.stats-table .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: .85rem; }
.stats-table .qty {
  font-weight: 800;
  text-align: center;
  color: var(--primary-dark);
}
.stats-empty { text-align: center; color: var(--text-muted); padding: 36px; }
.stats-empty-hint { margin-top: 8px; font-size: .82rem; line-height: 1.5; }
/* 統計表的欄位是用 td:nth-child 定位的——表頭 8 欄與 renderStats 的欄位順序改了，下面兩段與手機版卡片（Responsive 區）的規則要一起改。
   表格模式（寬度 >= 768px）：欄位不可被擠成一個字一行（中文每個字都能斷行，空間不夠時品名會先被擠扁），所以每欄給最小寬度；
   內容超過最小寬度照樣換行（不用 nowrap：一筆超長的編號或顏色不該把整張表撐寬）。只對 screen 生效；列印統計表有自己的一組（在 Print styles 的 print-mode-stats）。 */
@media screen and (min-width: 768px) {
  .stats-table th { white-space: nowrap; }
  /* 全站是 border-box，min-width 會把左右內距算進去；這裡改成 content-box，下面的最小寬度才是「內容」的寬度 */
  .stats-table td { box-sizing: content-box; }
  .stats-table td:nth-child(1), .stats-table td:nth-child(7) { white-space: nowrap; }
  .stats-table td:nth-child(2) { min-width: 11ch; overflow-wrap: anywhere; }
  .stats-table td:nth-child(3) { min-width: 9em; }
  .stats-table td:nth-child(4) { min-width: 2.5em; }
  .stats-table td:nth-child(5) { min-width: 4em; }
  .stats-table td:nth-child(6) { min-width: 3em; }
  .stats-table td:nth-child(8) { min-width: 5em; }
  .stats-table td.stats-empty { white-space: normal; }
}
/* 768～899px（平板直放）：左右內距縮小，8 欄的最小寬度才放得進去、不用水平捲動 */
@media screen and (min-width: 768px) and (max-width: 899px) {
  .stats-table th, .stats-table td { padding-left: 10px; padding-right: 10px; }
}
@media screen and (min-width: 900px) {
  .stats-table td:nth-child(3) { min-width: 13em; }
}

/* ===== Toast — 預設是反白（深字底＋白字），成功／失敗用狀態色字 + 淡底 ===== */
.toast-container {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.toast {
  background: var(--wiwi-text);
  color: var(--wiwi-surface);
  padding: 11px 24px;
  border-radius: 28px;
  font-size: .88rem;
  font-weight: 500;
  box-shadow: 0 8px 28px var(--shadow-lift);
  animation: toastIn .35s cubic-bezier(.22,1,.36,1);
  border: 1px solid var(--wiwi-text);
}
.toast.success {
  background: var(--wiwi-success-tint);
  color: var(--wiwi-success);
  border-color: var(--wiwi-success);
}
.toast.error {
  background: var(--wiwi-danger-tint);
  color: var(--wiwi-danger);
  border-color: var(--wiwi-danger);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(14px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Print header (hidden on screen) */
.print-header { display: none; }

/* Box label print area (hidden on screen) */
.box-label-print { display: none; }
.box-label-header { text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--wiwi-text); }
.box-label-header h2 { font-size: 1.4rem; margin-bottom: 4px; }
.box-label-meta { font-size: .85rem; color: var(--text-muted); }
.box-label-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.box-label-table th { background: var(--wiwi-surface-sunken); text-align: left; padding: 8px 10px; font-weight: 700; border-bottom: 2px solid var(--wiwi-text); }
.box-label-table td { padding: 8px 10px; border-bottom: 1px solid var(--wiwi-border); }
.box-label-table .mono { font-family: monospace; }
.box-label-table .qty { font-weight: 700; text-align: center; }
.box-label-footer { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--wiwi-border); font-size: .85rem; color: var(--text-muted); text-align: right; }

/* Sections visibility */
.section { display: none; }
.section.active { display: block; animation: fadeSection .3s ease; }
@keyframes fadeSection {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Nav tabs — Glass pill bar ===== */
.nav-tabs {
  display: flex;
  gap: 0;
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--neu-shadow-sm);
  margin-bottom: 20px;
  overflow: hidden;
  padding: 4px;
}
.nav-tab {
  flex: 1;
  padding: 11px 8px;
  text-align: center;
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  transition: all .2s;
  border-radius: calc(var(--radius) - 4px);
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active {
  color: var(--wiwi-thermal-on-fill);
  background: var(--wiwi-thermal-fill);
  border-color: var(--wiwi-thermal-solid); /* 選取狀態的邊界用深橘（對白底 4.75:1），橘 fill 單獨只有 2.2:1 */
  box-shadow: 0 4px 14px var(--primary-glow);
}

/* ===== Dialog ===== */
.dialog-backdrop {
  position: fixed;
  inset: 0;
  background: var(--wiwi-overlay);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dialog {
  background: var(--wiwi-surface-raised);
  color: var(--text);
  border: 1px solid var(--wiwi-border);
  border-radius: var(--radius);
  padding: 28px;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 20px 60px var(--shadow-lift);
  animation: dialogIn .25s cubic-bezier(.22,1,.36,1);
}
@keyframes dialogIn {
  from { opacity: 0; transform: scale(.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.dialog h3 { margin-bottom: 8px; font-size: 1.05rem; }
.dialog p { color: var(--text-muted); margin-bottom: 20px; font-size: .9rem; line-height: 1.5; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
.dialog-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.dialog-form label { font-size: .85rem; font-weight: 600; color: var(--text); }
.dialog-form > div { display: flex; flex-direction: column; gap: 4px; }
.dialog-form input, .dialog-form select {
  width: 100%;
  padding: 9px 12px; border: 1px solid var(--wiwi-border-strong); border-radius: var(--radius-sm);
  font-size: 16px; background: var(--wiwi-surface); box-shadow: var(--neu-inset);
  color: var(--text); transition: border-color .2s;
}
.dialog-form input:focus, .dialog-form select:focus { border-color: var(--wiwi-focus-ring); }
.dialog-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dialog-form .form-row > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

@keyframes dotPulse { 0%,20% { opacity: .2; } 50% { opacity: 1; } 80%,100% { opacity: .2; } }

/* Manual barcode input row */
.manual-input-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

/* 每次加入的數量（拍照與手動輸入共用） */
.scan-qty-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: .88rem; font-weight: 600; }
.scan-qty-row input {
  width: 96px;
  padding: 9px 12px;
  border: 1px solid var(--wiwi-border-strong);
  border-radius: var(--radius-sm);
  font-size: 16px;
  text-align: center;
  background: var(--wiwi-surface);
  box-shadow: var(--neu-inset);
  color: var(--text);
}
.scan-qty-row input:disabled { opacity: .5; cursor: not-allowed; }

/* 掃描清單：總表狀態標記與直接輸入數量 */
.scan-tag {
  display: inline-block;
  font-size: .72rem;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 20px;
  margin-left: 6px;
  vertical-align: middle;
}
.scan-tag-missing { background: var(--wiwi-danger-tint); color: var(--wiwi-danger); border: 1px solid var(--wiwi-danger); }
.scan-tag-unverified { background: var(--wiwi-warning-tint); color: var(--wiwi-warning); border: 1px solid var(--wiwi-warning); }
.item-qty-input {
  width: 72px;
  padding: 6px 8px;
  border: 1px solid var(--wiwi-border-strong);
  border-radius: var(--radius-sm);
  font-size: 16px;
  text-align: center;
  background: var(--wiwi-surface);
  color: var(--text);
}
.item-qty-label { font-size: .78rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

/* 商品對話框的提示區塊（總表查無／無法查詢） */
.dialog-wide { max-width: 520px; max-height: calc(100vh - 24px); overflow-y: auto; }
.dialog-alert { padding: 10px 12px; border-radius: var(--radius-sm); font-size: .88rem; line-height: 1.5; margin-bottom: 14px; }
.dialog-alert-danger { background: var(--wiwi-danger-tint); color: var(--wiwi-danger); border: 1px solid var(--wiwi-danger); }
.dialog-alert-warning { background: var(--wiwi-warning-tint); color: var(--wiwi-warning); border: 1px solid var(--wiwi-warning); }

/* 列印外箱明細：選擇視窗 */
.ob-pick-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.ob-pick-list { max-height: 45vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.ob-pick {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 10px;
  padding: 8px 10px;
  border: 1px solid var(--wiwi-border-strong);
  border-radius: var(--radius-sm);
  background: var(--wiwi-surface);
  font-size: .88rem;
  cursor: pointer;
}
.ob-pick.disabled { opacity: .5; cursor: not-allowed; }
.ob-pick-id { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.ob-pick-meta { color: var(--text-muted); font-size: .8rem; margin-left: auto; text-align: right; white-space: nowrap; }
.ob-pick-order { font-size: .78rem; font-weight: 700; color: var(--primary-dark); min-width: 2.2em; }
.ob-tag { white-space: nowrap; flex: none; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 20px; }
.ob-tag-open { background: var(--wiwi-success-tint); color: var(--wiwi-success); border: 1px solid var(--wiwi-success); }
.ob-tag-closed { background: var(--wiwi-surface-sunken); color: var(--text-muted); border: 1px solid var(--wiwi-border-strong); }
.ob-tag-sheet { background: var(--wiwi-thermal-tint); color: var(--wiwi-thermal-text-strong); border: 1px solid var(--wiwi-border-strong); }
.ob-pick-empty { color: var(--text-muted); font-size: .85rem; padding: 10px; text-align: center; border: 1px dashed var(--wiwi-border-strong); border-radius: var(--radius-sm); }

/* 列印外箱明細：從商品主檔載入別台裝置的箱子（手機窄螢幕：日期欄與按鈕可換行，不造成水平捲動） */
.ob-sheet { border: 1px solid var(--wiwi-border-strong); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 12px; min-width: 0; }
.ob-sheet .ob-sheet-hint { margin-bottom: 8px; font-size: .82rem; }
.ob-sheet-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ob-sheet-date {
  flex: 1 1 150px; min-width: 0; max-width: 100%;
  padding: 8px 10px; border: 1px solid var(--wiwi-border-strong); border-radius: var(--radius-sm);
  font-size: 16px; background: var(--wiwi-surface); box-shadow: var(--neu-inset); color: var(--text);
}
.ob-sheet-date:focus { border-color: var(--wiwi-focus-ring); }
.ob-sheet-status { margin-top: 8px; font-size: .85rem; line-height: 1.5; overflow-wrap: anywhere; color: var(--text-muted); }
.ob-sheet-status.is-error { color: var(--wiwi-danger); }

/* 列印外箱明細：A4 直式一頁兩箱（畫面與列印用同一份樣式，量高度才準；字型只用系統字型，不載入任何外部資源） */
#outer-box-print { display: none; }
.ob-page, .ob-measure {
  font-family: "Noto Sans CJK TC", "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", "WenQuanYi Micro Hei", sans-serif;
  color: var(--wiwi-text);
}
.ob-measure { position: absolute; left: -9999px; top: 0; width: 194mm; visibility: hidden; pointer-events: none; }
.ob-page { width: 194mm; height: 276mm; break-after: page; page-break-after: always; }
.ob-page:last-child { break-after: auto; page-break-after: auto; }
.ob-slot { height: 135mm; overflow: visible; }
.ob-slot-full { height: 276mm; }
.ob-cut { height: 3mm; margin-bottom: 3mm; border-bottom: 1.5px dashed var(--wiwi-text); }
.ob-table { width: 100%; border-collapse: collapse; table-layout: fixed; color: var(--wiwi-text); }
.ob-table th, .ob-table td { border: 1.5px solid var(--wiwi-text); padding: 6px 10px; text-align: left; vertical-align: middle; overflow-wrap: anywhere; word-break: break-word; }
.ob-table tr { break-inside: avoid; page-break-inside: avoid; }
.ob-title th { font-size: 30pt; font-weight: 800; line-height: 1.25; padding: 8px 12px; }
.ob-colhead th { font-size: 13pt; font-weight: 700; }
.ob-row td { font-size: 14pt; line-height: 1.35; }
.ob-col-code { width: 24%; }
.ob-col-name { width: 60%; }
.ob-col-qty { width: 16%; }
.ob-code { white-space: nowrap; font-variant-numeric: tabular-nums; }
.ob-qty { text-align: center !important; font-variant-numeric: tabular-nums; }
.ob-row .ob-qty { font-weight: 800; font-size: 16pt; }
.ob-total td { font-size: 15pt; font-weight: 800; text-align: right; }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .scan-item-info { flex: 1 1 100%; }
  .current-box-banner { padding: 12px 12px; }
  .header h1 { font-size: .95rem; }
  .header { padding: 6px 12px; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; font-size: .88rem; }
  .main { padding: 14px 10px; }
  .card { padding: 18px 16px; }
}

/* 統計報表在窄螢幕（< 768px：手機直放、小平板）改成一筆一張卡片——8 欄的表格放不下。同一份 DOM，只改排版。
   第 1 行：序號、商品編號、（靠右）數量；第 2 行：品名；第 3 行：性別／顏色／尺寸；第 4 行：所在箱號。
   只對 screen 生效——列印統計表走 print media，仍然是表格。 */
@media screen and (max-width: 767px) {
  .stats-table, .stats-table tbody { display: block; }
  .stats-table thead { display: none; }
  .stats-table tbody tr {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    padding: 12px 2px; border-bottom: 1px solid var(--border-subtle);
  }
  .stats-table tbody td {
    display: block; padding: 0; border-bottom: none; min-width: 0;
    white-space: normal; overflow-wrap: anywhere;
  }
  .stats-table tbody td::before { color: var(--text-muted); font-weight: 400; font-size: .8rem; }
  /* 卡片之間有空隙，hover 的底色改畫在整列上，才不會一塊一塊的 */
  .stats-table tbody tr:hover { background: var(--wiwi-thermal-tint); }
  .stats-table tbody tr:hover td { background: none; }
  .stats-table tbody td:nth-child(1) { order: 1; flex: 0 0 auto; white-space: nowrap; color: var(--text-muted); font-size: .8rem; }
  /* 商品編號吃掉第 1 行剩下的寬度（flex-basis 0：再長也是在自己的格子裡換行，不會把數量擠到下一行） */
  .stats-table tbody td:nth-child(2) { order: 2; flex: 1 1 0; }
  .stats-table tbody td:nth-child(7) { order: 3; flex: 0 0 auto; white-space: nowrap; text-align: right; font-size: 1.05rem; }
  .stats-table tbody td:nth-child(7)::before { content: '數量 '; }
  .stats-table tbody td:nth-child(3) { order: 4; flex: 0 0 100%; font-weight: 700; font-size: .95rem; line-height: 1.45; }
  .stats-table tbody td:nth-child(4) { order: 5; flex: 0 1 auto; }
  .stats-table tbody td:nth-child(4)::before { content: '性別 '; }
  .stats-table tbody td:nth-child(5) { order: 6; flex: 0 1 auto; }
  .stats-table tbody td:nth-child(5)::before { content: '顏色 '; }
  .stats-table tbody td:nth-child(6) { order: 7; flex: 0 1 auto; }
  .stats-table tbody td:nth-child(6)::before { content: '尺寸 '; }
  .stats-table tbody td:nth-child(8) { order: 8; flex: 0 0 100%; }
  .stats-table tbody td:nth-child(8)::before { content: '箱號 '; }
  .stats-table tbody td.stats-empty { order: 0; flex: 0 0 100%; padding: 28px 8px; white-space: normal; color: var(--text-muted); font-size: .88rem; text-align: center; }
}

/* ===== Print styles ===== */
@media print {
  body { background: var(--wiwi-surface) !important; background-image: none !important; }
  .header, .nav-tabs, .toast-container, .no-print, .btn { display: none !important; }
  .main { max-width: 100%; padding: 0; }
  .card { box-shadow: none; padding: 0; background: var(--wiwi-surface); backdrop-filter: none; border: none; }

  .section { display: none !important; }
  .box-label-print { display: none !important; }

  body.print-mode-stats #section-stats { display: block !important; }
  body.print-mode-stats .print-header {
    display: block;
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--wiwi-text);
  }
  body.print-mode-stats .print-header h2 { font-size: 1.3rem; margin-bottom: 4px; }
  body.print-mode-stats .print-header .print-meta { font-size: .85rem; color: var(--text-muted); }
  body.print-mode-stats .stats-table { font-size: .85rem; border-collapse: collapse; }
  body.print-mode-stats .stats-table th {
    background: var(--wiwi-surface-sunken);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  /* 列印統計表：和螢幕的表格模式一樣，每欄給最小寬度（內容寬度），不讓品名、性別、顏色被擠成直的
     （一筆商品分裝在很多箱時，所在箱號那一欄會把其他欄擠扁）；左右內距縮成 8px，A4 直式放得下。欄位一樣用 td:nth-child 定位。 */
  body.print-mode-stats .stats-table th { white-space: nowrap; padding-left: 8px; padding-right: 8px; }
  body.print-mode-stats .stats-table td { box-sizing: content-box; padding-left: 8px; padding-right: 8px; }
  body.print-mode-stats .stats-table td:nth-child(1), body.print-mode-stats .stats-table td:nth-child(7) { white-space: nowrap; }
  body.print-mode-stats .stats-table td:nth-child(2) { min-width: 11ch; overflow-wrap: anywhere; }
  body.print-mode-stats .stats-table td:nth-child(3) { min-width: 12em; }
  body.print-mode-stats .stats-table td:nth-child(4) { min-width: 2.5em; }
  body.print-mode-stats .stats-table td:nth-child(5) { min-width: 4em; }
  body.print-mode-stats .stats-table td:nth-child(6) { min-width: 3em; }
  body.print-mode-stats .stats-table td:nth-child(8) { min-width: 5em; }
  body.print-mode-stats .stats-table td.stats-empty { white-space: normal; }

  body.print-mode-box .box-label-print { display: block !important; }
  body.print-mode-box .box-label-table th {
    background: var(--wiwi-surface-sunken);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* 外箱明細：只印 #outer-box-print，其餘全部隱藏（紙張設定由 PrintManager 在列印前動態加入 @page，只在這個模式生效） */
  body.print-mode-outerbox .main,
  body.print-mode-outerbox .dialog-backdrop { display: none !important; }
  body.print-mode-outerbox #outer-box-print { display: block !important; }
}
</style>
</head>
<body>

<div class="userbar no-print" id="userbar" hidden>
  <span id="userbar-user"></span>
  <a href="/account">我的帳號</a>
  <a href="/settings" id="userbar-settings" hidden>設定</a>
  <button type="button" id="userbar-logout">登出</button>
</div>

<header class="header">
  <img class="brand-logo" src="/assets/wiwi-logo.svg" alt="WIWI" width="53" height="48">
  <h1>IPAS 庫存盤點裝箱系統</h1>
  <div class="header-actions">
    <button class="btn btn-sm btn-outline" id="btn-reset-product-cache">重設品名記憶</button>
    <button class="btn btn-sm btn-outline" onclick="confirmClearAll()">清除資料</button>
  </div>
</header>

<nav class="nav-tabs no-print">
  <button class="nav-tab active" data-tab="packing">裝箱作業</button>
  <button class="nav-tab" data-tab="stats">統計報表</button>
</nav>

<main class="main">
  <!-- Section: Packing -->
  <div id="section-packing" class="section active">

    <!-- Box creation -->
    <div class="card">
      <div class="card-title">📦 箱號管理</div>
      <div class="box-create-row">
        <input type="text" id="input-box-id" placeholder="輸入箱號（留空自動產生）" maxlength="20">
        <button class="btn btn-primary" id="btn-new-box">新增箱號</button>
      </div>
      <!-- Box tabs -->
      <div class="box-tabs" id="box-tabs" style="margin-top:14px"></div>
    </div>

    <!-- Current box banner -->
    <div class="current-box-banner" id="current-box-banner" style="display:none">
      <div>
        <span>目前箱號：</span>
        <span class="box-id" id="current-box-id"></span>
        <span class="box-status status-open" id="current-box-status">開放中</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" id="btn-print-box">列印標籤單</button>
        <button class="btn btn-outline btn-sm" id="btn-print-outer-current">列印外箱明細</button>
        <button class="btn btn-success btn-sm" id="btn-close-box">完成此箱</button>
      </div>
    </div>

    <!-- Camera OCR：一直顯示；沒有開放中的箱號時停用控制項並提示「請先新增箱號」（見 renderCurrentBox／setScannerEnabled） -->
    <div class="card" id="scanner-card">
      <div class="card-title">📷 拍照辨識</div>
      <div class="scan-qty-row">
        <label for="input-scan-qty">每次加入數量</label>
        <input type="number" id="input-scan-qty" value="1" min="1" max="9999" step="1" inputmode="numeric">
      </div>
      <div class="scanner-area" id="scanner-area">
        <div class="scanner-placeholder" id="scanner-placeholder">
          <div class="icon">📷</div>
          <div id="scanner-hint">點擊下方按鈕開啟相機</div>
        </div>
        <video id="camera-video" autoplay playsinline style="display:none"></video>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" id="btn-start-scan">開啟相機</button>
        <button class="btn btn-outline" id="btn-stop-scan" style="display:none">關閉相機</button>
      </div>
      <button class="btn-capture" id="btn-capture" style="display:none;margin-top:10px" disabled>📸 拍照辨識</button>
      <div id="ocr-status" style="margin-top:8px;font-size:.85rem;color:var(--primary-dark);text-align:center;display:none"></div>
      <div class="manual-input-row">
        <input type="text" id="input-manual-barcode" placeholder="手動輸入條碼">
        <button class="btn btn-primary btn-sm" id="btn-add-manual">加入</button>
      </div>
    </div>

    <!-- Current box item list -->
    <div class="card" id="item-list-card" style="display:none">
      <div class="card-title">📋 本箱掃描清單 (<span id="item-count">0</span> 筆)</div>
      <ul class="scan-list" id="scan-list">
        <li class="empty">尚無掃描記錄</li>
      </ul>
    </div>
  </div>

  <!-- Section: Stats -->
  <div id="section-stats" class="section">
    <div class="print-header">
      <h2>庫存盤點統計報表</h2>
      <div class="print-meta" id="print-meta"></div>
    </div>
    <div class="card">
      <div class="card-title" style="justify-content:space-between;flex-wrap:wrap">
        <span>📊 統計報表</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm no-print" id="btn-print-outer-stats">列印外箱明細</button>
          <button class="btn btn-primary btn-sm no-print" id="btn-print">列印統計表</button>
        </span>
      </div>
      <div id="stats-summary" style="margin-bottom:14px;font-size:.9rem;color:var(--text-muted)"></div>
      <div style="overflow-x:auto">
        <table class="stats-table" id="stats-table">
          <thead>
            <tr>
              <th>#</th>
              <th>商品編號</th>
              <th>品名</th>
              <th>性別</th>
              <th>顏色</th>
              <th>尺寸</th>
              <th>數量</th>
              <th>所在箱號</th>
            </tr>
          </thead>
          <tbody id="stats-tbody">
            <tr><td colspan="8" class="stats-empty">尚無盤點資料<div class="stats-empty-hint no-print">這裡只顯示這台裝置掃描的資料；要印別台裝置掃的箱子，請按「列印外箱明細」從商品主檔載入。</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Box label print area (hidden on screen, shown only when printing box label) -->
<div id="box-label-print" class="box-label-print">
  <div class="box-label-header">
    <h2 id="box-label-title"></h2>
    <div class="box-label-meta" id="box-label-meta"></div>
  </div>
  <table class="box-label-table">
    <thead>
      <tr>
        <th>#</th>
        <th>商品編號</th>
        <th>品名</th>
        <th>性別</th>
        <th>顏色</th>
        <th>尺寸</th>
        <th>數量</th>
      </tr>
    </thead>
    <tbody id="box-label-tbody"></tbody>
  </table>
  <div class="box-label-footer" id="box-label-footer"></div>
</div>

<!-- 外箱明細列印區（畫面上隱藏；產生後保留到下一次列印才覆蓋，只在 print-mode-outerbox 時顯示） -->
<div id="outer-box-print"></div>

<div class="toast-container" id="toast-container"></div>

<script>
// ========== Store ==========
const Store = {
  KEY: 'ipas-state',
  saveState(state) {
    try { localStorage.setItem(this.KEY, JSON.stringify(state)); } catch(e) {}
  },
  loadState() {
    try {
      const d = localStorage.getItem(this.KEY);
      return d ? JSON.parse(d) : null;
    } catch(e) { return null; }
  },
  clearState() { localStorage.removeItem(this.KEY); }
};

// ========== App State ==========
let state = Store.loadState() || { boxes: [], currentBoxId: null, lastBoxSeq: 0, productCache: {} };
if (!state.productCache) state.productCache = {};

function persist() { Store.saveState(state); }

// ========== BoxManager ==========
const BoxManager = {
  createBox(customId) {
    let id;
    if (customId && customId.trim()) {
      id = customId.trim();
    } else {
      state.lastBoxSeq++;
      id = 'BOX-' + String(state.lastBoxSeq).padStart(3, '0');
    }
    if (state.boxes.find(b => b.id === id)) {
      showToast('箱號已存在：' + id, 'error');
      return null;
    }
    const box = { id, createdAt: new Date().toISOString(), status: 'open', items: [] };
    state.boxes.push(box);
    state.currentBoxId = id;
    persist();
    return box;
  },
  closeBox(boxId) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return;
    box.status = 'closed';
    if (state.currentBoxId === boxId) state.currentBoxId = null;
    persist();
  },
  addItem(boxId, barcode, info) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box || box.status === 'closed') return null;
    info = info || {};
    const item = {
      scanId: crypto.randomUUID(),
      barcode: barcode.trim(),
      productName: info.productName || '',
      gender: info.gender || '',
      color: info.color || '',
      size: info.size || '',
      qty: info.qty || 1,
      scannedAt: new Date().toISOString()
    };
    if (info.officialName) item.officialName = info.officialName;
    if (info.catalog) item.catalog = info.catalog;
    box.items.push(item);
    persist();
    return item;
  },
  removeItem(boxId, scanId) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return;
    box.items = box.items.filter(i => i.scanId !== scanId);
    persist();
  },
  updateItem(boxId, scanId, updates) {
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return null;
    const item = box.items.find(i => i.scanId === scanId);
    if (!item) return null;
    if (updates.productName !== undefined) item.productName = updates.productName;
    if (updates.gender !== undefined) item.gender = updates.gender;
    if (updates.color !== undefined) item.color = updates.color;
    if (updates.size !== undefined) item.size = updates.size;
    if (updates.qty !== undefined) item.qty = updates.qty;
    if (updates.officialName !== undefined) {
      if (updates.officialName) item.officialName = updates.officialName;
      else delete item.officialName;
    }
    if (updates.catalog !== undefined) item.catalog = updates.catalog;
    persist();
    return item;
  },
  renameBox(boxId, newId) {
    newId = newId.trim();
    if (!newId) return false;
    if (newId === boxId) return true;
    if (state.boxes.find(b => b.id === newId)) {
      showToast('箱號已存在：' + newId, 'error');
      return false;
    }
    const box = state.boxes.find(b => b.id === boxId);
    if (!box) return false;
    box.id = newId;
    if (state.currentBoxId === boxId) state.currentBoxId = newId;
    persist();
    return true;
  },
  deleteBox(boxId) {
    state.boxes = state.boxes.filter(b => b.id !== boxId);
    if (state.currentBoxId === boxId) state.currentBoxId = null;
    persist();
  },
  getBox(boxId) { return state.boxes.find(b => b.id === boxId) || null; },
  getCurrentBox() { return state.currentBoxId ? this.getBox(state.currentBoxId) : null; }
};

// ========== AggregationEngine ==========
const AggregationEngine = {
  aggregate(boxes) {
    const map = new Map();
    for (const box of boxes) {
      for (const item of box.items) {
        if (!map.has(item.barcode)) {
          map.set(item.barcode, { barcode: item.barcode, productName: item.productName, gender: item.gender || '', color: item.color || '', size: item.size || '', totalQty: 0, boxes: [] });
        }
        const agg = map.get(item.barcode);
        agg.totalQty += (item.qty || 1);
        if (!agg.productName && item.productName) agg.productName = item.productName;
        if (!agg.gender && item.gender) agg.gender = item.gender;
        if (!agg.color && item.color) agg.color = item.color;
        if (!agg.size && item.size) agg.size = item.size;
        if (!agg.boxes.includes(box.id)) agg.boxes.push(box.id);
      }
    }
    return Array.from(map.values()).sort((a, b) => a.barcode.localeCompare(b.barcode));
  }
};

// ========== CameraEngine ==========
const CameraEngine = {
  _stream: null,

  async start(videoEl) {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    videoEl.srcObject = stream;
    this._stream = stream;
  },

  stop(videoEl) {
    if (this._stream) {
      this._stream.getTracks().forEach(t => t.stop());
      this._stream = null;
    }
    if (videoEl) videoEl.srcObject = null;
  },

  captureFrame(videoEl) {
    if (!videoEl || !videoEl.videoWidth) return null;
    const MAX_W = 1024;
    let w = videoEl.videoWidth, h = videoEl.videoHeight;
    if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(videoEl, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', 0.7);
  }
};

// ========== ApiClient (所有 /api 請求共用：帶 CSRF 標頭 X-Requested-With；回 401＝登入過期，導回登入頁) ==========
const ApiClient = {
  expired: false,

  // 沒登入或登入過期：導到登入頁，登入後回到目前這一頁。箱子的資料都在 localStorage，不受影響。
  toLogin() {
    this.expired = true;
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
  },

  async request(url, init) {
    const resp = await fetch(url, init);
    if (resp.status === 401) this.toLogin();
    return resp;
  },

  post(url, payload) {
    return this.request(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify(payload)
    });
  },

  get(url) {
    return this.request(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
  }
};

// ========== OCREngine (後端 /api/ocr → OpenAI Vision) ==========
const OCREngine = {
  WEBHOOK_URL: '/api/ocr',

  async recognize(imageDataUrl, boxId) {
    if (!imageDataUrl) return null;
    try {
      const resp = await ApiClient.post(this.WEBHOOK_URL, { barcode: '', boxId: boxId || '', image: imageDataUrl });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const result = await resp.json();
      if (result.success && result.data) return result.data;
      return null;
    } catch(e) {
      console.error('OCR API error:', e);
      return null;
    }
  }
};

// ========== SaveEngine (後端 /api/save → Google Sheets) ==========
const SaveEngine = {
  SAVE_URL: '/api/save',

  async saveBoxItems(box) {
    if (!box || box.items.length === 0) return { success: false, error: '無資料可儲存' };

    const results = [];
    const now = new Date();
    const taipeiOffset = 8 * 60 * 60 * 1000;
    const dateStr = new Date(now.getTime() + taipeiOffset).toISOString().split('T')[0].replace(/-/g, '/');
    const timeStr = new Date(now.getTime() + taipeiOffset).toISOString().replace('T', ' ').substring(0, 19);

    // ★ 逐筆發送，不聚合 — 尊重使用者編輯後的數量
    for (let i = 0; i < box.items.length; i++) {
      const item = box.items[i];
      try {
        const payload = {
          seqNo: String(i + 1),
          date: dateStr,
          boxId: box.id,
          barcode: item.barcode,
          productName: item.productName || '',
          gender: item.gender || '',
          color: item.color || '',
          size: item.size || '',
          quantity: item.qty || 1,
          time: timeStr
        };
        const resp = await ApiClient.post(this.SAVE_URL, payload);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const result = await resp.json();
        results.push({ barcode: item.barcode, success: result.success });
      } catch (e) {
        console.error('Save error for', item.barcode, e);
        results.push({ barcode: item.barcode, success: false, error: e.message });
        if (ApiClient.expired) break; // 登入過期：頁面正在導向登入頁，別再對後面每一筆重複送
      }
    }

    const successCount = results.filter(r => r.success).length;
    return {
      success: successCount === results.length,
      total: results.length,
      successCount,
      failCount: results.length - successCount,
      results
    };
  }
};

// ========== NotifyEngine (後端 /api/box-closed → LINE 群組通知) ==========
const NotifyEngine = {
  NOTIFY_URL: '/api/box-closed',

  // 關箱後通知 LINE 群組。任何失敗都不能影響關箱：整段包 try/catch，只在推播失敗時提示，其餘只寫 console。
  // saveResult 是 SaveEngine.saveBoxItems 的回傳；它丟例外（null）時，成功筆數算 0。
  async boxClosed(box, saveResult) {
    try {
      // 空箱子（沒有任何商品）不通知：同步會顯示「無資料可儲存」，再發一則「已完成」的 LINE 訊息只會互相矛盾。
      if (Array.isArray(box.items) && box.items.length === 0) return;
      // 超過後端驗證上限的值（數量 9999、文字 200 字、500 筆）先截斷：不然整則通知會被 400 擋掉、什麼都收不到。
      const clip = value => String(value || '').slice(0, 200);
      const items = box.items.slice(0, 500).map(item => ({
        barcode: clip(item.barcode),
        productName: clip(item.productName),
        gender: clip(item.gender),
        color: clip(item.color),
        size: clip(item.size),
        qty: Math.min(9999, Math.max(1, parseInt(item.qty, 10) || 1))
      }));
      const total = saveResult && typeof saveResult.total === 'number' ? saveResult.total : items.length;
      const successCount = saveResult && typeof saveResult.successCount === 'number' ? saveResult.successCount : 0;
      const failedCount = saveResult && typeof saveResult.failCount === 'number' ? saveResult.failCount : total - successCount;
      const resp = await ApiClient.post(this.NOTIFY_URL, { boxId: box.id, closedAt: new Date().toISOString(), items, total, successCount, failedCount });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const result = await resp.json();
      if (result.notified === false && result.reason === 'push_failed') {
        showToast('LINE 通知失敗（不影響關箱）', 'error');
      }
    } catch (e) {
      console.error('LINE notify error:', e);
    }
  }
};

// ========== CloseFlow (關箱的同步流程：先確認登入還有效，再同步到商品主檔；登入過期時整個中止，箱子保持開啟) ==========
const CloseFlow = {
  // 送出任何一筆之前先問伺服器「我還登入著嗎」：過期（401）時 ApiClient 已經在導向登入頁，這裡回 false。
  // 網路斷線或伺服器錯誤不算過期（回 true）：照原本的流程走，同步失敗會顯示在提示裡，箱子仍然完成。
  async sessionAlive() {
    try {
      await ApiClient.get('/api/me');
    } catch (e) {
      console.error('Session check failed:', e);
    }
    return !ApiClient.expired;
  },

  // 回傳 { proceed, saveResult }：
  //   proceed=false：登入過期（頁面正在導向登入頁），箱子保持開啟、沒有任何「已完成」的提示；登入後再按一次「完成此箱」。
  //   proceed=true：其他任何結果（全部成功、部分失敗、全部失敗、同步丟例外）都照原本的行為完成這個箱子。
  //   saveResult：SaveEngine.saveBoxItems 的回傳；它丟例外時是 null（關箱通知用）。
  async sync(box) {
    if (!(await this.sessionAlive())) return { proceed: false, saveResult: null };
    showToast('正在同步到商品主檔…', '');
    let saveResult = null;
    let saveError = null;
    try {
      saveResult = await SaveEngine.saveBoxItems(box);
    } catch (e) {
      saveError = e;
    }
    // 同步途中登入過期：不要把箱子鎖起來卻沒同步完（頁面正在導向登入頁，提示也來不及看）。
    if (ApiClient.expired) return { proceed: false, saveResult };
    if (saveError) {
      console.error('Save failed:', saveError);
      showToast('同步發生錯誤：' + saveError.message, 'error');
    } else if (saveResult.success) {
      showToast(`已同步 ${saveResult.successCount} 筆到商品主檔 ✓`, 'success');
    } else if (saveResult.successCount > 0) {
      showToast(`部分同步：${saveResult.successCount}/${saveResult.total} 筆成功`, 'error');
    } else {
      showToast('同步失敗，但箱號仍會完成', 'error');
    }
    return { proceed: true, saveResult };
  }
};

// ========== PrintManager ==========
const PrintManager = {
  _setPrintMode(mode) {
    document.body.classList.remove('print-mode-stats', 'print-mode-box', 'print-mode-outerbox');
    // 外箱明細的 @page（A4 直式）只在外箱明細模式生效：切到任何其他模式（或結束列印）就移除，不影響既有兩種列印
    const pageStyle = document.getElementById('outer-box-page-style');
    if (pageStyle) pageStyle.remove();
    if (mode) document.body.classList.add('print-mode-' + mode);
  },
  // 外箱明細：把已排好版的 HTML 放進 #outer-box-print（保留到下一次列印才覆蓋）→ 進入列印模式＋插入 @page → 列印。
  // 手機瀏覽器的 print() 會立刻返回，所以不能在這裡清掉列印模式；改在 afterprint 事件呼叫 endOuterBoxPrint()。
  printOuterBoxes(pagesHtml) {
    document.getElementById('outer-box-print').innerHTML = pagesHtml;
    this._setPrintMode('outerbox');
    const pageStyle = document.createElement('style');
    pageStyle.id = 'outer-box-page-style';
    pageStyle.textContent = '@page { size: A4 portrait; margin: 10.5mm 8mm 8mm; }';
    document.head.appendChild(pageStyle);
    window.print();
  },
  endOuterBoxPrint() {
    if (document.body.classList.contains('print-mode-outerbox')) this._setPrintMode(null);
  },
  printStats() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('zh-TW') + ' ' + now.toLocaleTimeString('zh-TW');
    const boxCount = state.boxes.length;
    const closedCount = state.boxes.filter(b => b.status === 'closed').length;
    document.getElementById('print-meta').textContent =
      `列印日期：${dateStr}　|　總箱數：${boxCount}　|　已完成：${closedCount}`;
    this._setPrintMode('stats');
    window.print();
    this._setPrintMode(null);
  },
  printBoxLabel(boxId) {
    const box = BoxManager.getBox(boxId);
    if (!box) return;

    // Aggregate items within this box
    const map = new Map();
    for (const item of box.items) {
      if (!map.has(item.barcode)) {
        map.set(item.barcode, { barcode: item.barcode, productName: item.productName, gender: item.gender || '', color: item.color || '', size: item.size || '', qty: 0 });
      }
      const agg = map.get(item.barcode);
      agg.qty += (item.qty || 1);
      if (!agg.productName && item.productName) agg.productName = item.productName;
      if (!agg.gender && item.gender) agg.gender = item.gender;
      if (!agg.color && item.color) agg.color = item.color;
      if (!agg.size && item.size) agg.size = item.size;
    }
    const aggItems = Array.from(map.values()).sort((a, b) => a.barcode.localeCompare(b.barcode));
    const totalQty = aggItems.reduce((s, a) => s + a.qty, 0);

    // Fill print area
    const now = new Date();
    const dateStr = now.toLocaleDateString('zh-TW') + ' ' + now.toLocaleTimeString('zh-TW');
    document.getElementById('box-label-title').textContent = `裝箱標籤單 — ${box.id}`;
    document.getElementById('box-label-meta').textContent =
      `狀態：${box.status === 'closed' ? '已完成' : '開放中'}　|　建立時間：${new Date(box.createdAt).toLocaleString('zh-TW')}　|　列印時間：${dateStr}`;

    const tbody = document.getElementById('box-label-tbody');
    tbody.innerHTML = '';
    aggItems.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td class="mono">${escHtml(item.barcode)}</td>
        <td>${escHtml(item.productName) || '—'}</td>
        <td>${escHtml(item.gender) || '—'}</td>
        <td>${escHtml(item.color) || '—'}</td>
        <td>${escHtml(item.size) || '—'}</td>
        <td class="qty">${item.qty}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('box-label-footer').textContent =
      `共 ${aggItems.length} 種商品，合計 ${totalQty} 件`;

    this._setPrintMode('box');
    window.print();
    this._setPrintMode(null);
  }
};

// ========== ProductFlow (商品編號 → 同箱累加／查商品總表／手動輸入 → 加入箱子；純邏輯，相依的東西都從參數傳入，不碰 DOM、state、localStorage) ==========
// 品名只來自商品總表（POST /api/products/lookup）。OCR 只提供商品編號，OCR 回傳的品名、性別、顏色、尺寸一律不採用。
// 品名記憶（productCache）每筆多一個 source：'edit'（編輯商品改過，優先於總表）、'manual'（查無時手動輸入，只用來預填）；
// 沒有 source 的舊資料（改版前 AI 猜的）比照 'manual'，絕不蓋過總表。
const ProductFlow = {
  LOOKUP_URL: '/api/products/lookup',
  MAX_QTY: 9999,
  _busy: false,

  /** 數量一律是 1～9999 的整數：非數字、0、負數 → 1；小數捨去；超過 9999 → 9999。 */
  clampQty(value) {
    const n = Math.floor(Number(value));
    if (Number.isNaN(n)) return 1;
    return Math.min(this.MAX_QTY, Math.max(1, n));
  },

  _text(value) {
    return value === undefined || value === null ? '' : String(value).trim();
  },

  _fieldsOf(source) {
    const s = source || {};
    return { productName: this._text(s.productName), gender: this._text(s.gender), color: this._text(s.color), size: this._text(s.size) };
  },

  cacheGet(cache, code) {
    if (!cache || !Object.prototype.hasOwnProperty.call(cache, code)) return null;
    const entry = cache[code];
    return entry && typeof entry === 'object' ? entry : null;
  },

  cacheSet(cache, code, entry) {
    if (cache && code !== '__proto__') cache[code] = entry;
  },

  /** 重設品名記憶：只清空記憶，箱子與商品不動。回傳清掉幾筆。 */
  resetCache(appState) {
    const removed = Object.keys(appState.productCache || {}).length;
    appState.productCache = {};
    return removed;
  },

  findItem(box, code) {
    return box.items.find(item => item.barcode === code) || null;
  },

  /** 查商品總表。失敗（斷線、4xx/5xx、回應格式不對）一律回 { ok: false }，不丟例外。成功回 { ok: true, products: Map<編號, 商品> }（查不到的編號不在 Map 裡）。 */
  async lookup(api, barcodes) {
    try {
      const resp = await api.post(this.LOOKUP_URL, { barcodes });
      if (!resp.ok) return { ok: false };
      const body = await resp.json();
      const data = body && body.success === true ? body.data : null;
      if (!data || !data.products || typeof data.products !== 'object') return { ok: false };
      const products = new Map();
      for (const code of Object.keys(data.products)) {
        const p = data.products[code];
        if (p && typeof p === 'object') products.set(code, { ...this._fieldsOf(p), officialName: this._text(p.officialName) });
      }
      return { ok: true, products };
    } catch (e) {
      return { ok: false };
    }
  },

  /** 同一箱已有這個編號就把數量加上去（上限 9999），沒有才新增一筆。改版前留下的重複資料不合併，累加到第一筆。 */
  addOrMerge(box, code, info, qty, deps) {
    if (!deps.isBoxOpen(box)) return { status: 'closed' };
    const existing = this.findItem(box, code);
    if (existing) {
      const sum = (Number(existing.qty) || 1) + qty;
      existing.qty = Math.min(this.MAX_QTY, sum);
      deps.persist();
      return { status: 'merged', item: existing, capped: sum > this.MAX_QTY };
    }
    const item = deps.addItem(box.id, code, { ...info, qty });
    return item ? { status: 'added', item } : { status: 'closed' };
  },

  /**
   * 拿到商品編號之後的唯一流程（拍照與手動輸入共用）。
   * input: { barcode, qty }；deps: { box, api, cache(), isBoxOpen(box), addItem(boxId, code, info), persist(),
   *   askBarcode() → 編號或 null, askProduct({ barcode, reason: 'missing'|'unverified', prefill, qty }) → { barcode, info, qty } 或 null, notify(msg, type) }
   * 回傳 { status: 'added'|'merged'|'closed'|'cancelled'|'busy', item?, catalog?, capped? }（busy＝上一筆還在處理，這一次被忽略）。
   */
  async run(input, deps) {
    // 防連點：上一筆（查詢或視窗）還沒結束時直接忽略，數量框填 100 連點兩下才不會變 200
    if (this._busy) return { status: 'busy' };
    this._busy = true;
    try {
      return await this._run(input, deps);
    } finally {
      this._busy = false;
    }
  },

  async _run(input, deps) {
    let code = this._text(input.barcode);
    if (!code) {
      code = this._text(await deps.askBarcode());
      if (!code) return { status: 'cancelled' };
    }
    return this._resolve(code, this.clampQty(input.qty), deps, null);
  },

  // typed：人員在「總表查無」視窗手動輸入、又改了商品編號時帶進來的內容（用新編號再查一次；仍查不到才用它）
  async _resolve(code, qty, deps, typed) {
    const box = deps.box;
    if (!deps.isBoxOpen(box)) return { status: 'closed' };
    if (this.findItem(box, code)) return this.addOrMerge(box, code, {}, qty, deps);

    // 編輯商品改過的品名優先於總表（查得到也一樣），不必再查
    const remembered = this.cacheGet(deps.cache(), code);
    if (remembered && remembered.source === 'edit') {
      return this.addOrMerge(box, code, { ...this._fieldsOf(remembered), catalog: 'edited' }, qty, deps);
    }

    const found = await this.lookup(deps.api, [code]);
    if (found.ok) {
      const product = found.products.get(code);
      if (product) {
        if (typed) deps.notify('商品編號 ' + code + ' 在總表查得到，已改用總表品名', '');
        const info = { productName: product.productName, gender: product.gender, color: product.color, size: product.size, officialName: product.officialName, catalog: 'found' };
        return { ...this.addOrMerge(box, code, info, qty, deps), catalog: 'found' };
      }
    }
    const catalog = found.ok ? 'missing' : 'unverified';
    if (typed) return this._addManual(box, code, typed, qty, catalog, deps);

    // 查無／無法查詢：跳視窗讓人員手動輸入（只用 manual 或舊資料的記憶預填）
    const answer = await deps.askProduct({ barcode: code, reason: found.ok ? 'missing' : 'unverified', prefill: remembered ? this._fieldsOf(remembered) : {}, qty });
    const answeredCode = answer ? this._text(answer.barcode) : '';
    if (!answer || !answeredCode) return { status: 'cancelled' };
    const answeredQty = this.clampQty(answer.qty);
    const info = this._fieldsOf(answer.info);
    if (answeredCode !== code) return this._resolve(answeredCode, answeredQty, deps, info);
    return this._addManual(box, code, info, answeredQty, catalog, deps);
  },

  _addManual(box, code, info, qty, catalog, deps) {
    this.cacheSet(deps.cache(), code, { ...this._fieldsOf(info), source: 'manual' });
    deps.persist();
    return { ...this.addOrMerge(box, code, { ...this._fieldsOf(info), catalog }, qty, deps), catalog };
  },

  /**
   * 編輯商品存檔前先算好：品名／性別／顏色／尺寸有沒有真的改、要寫進記憶的內容與商品新的 catalog。
   * 記憶的 source：這筆是「總表查無／未核對」時記 'manual'，其他（found、舊資料）記 'edit'。
   * 只改數量（四個欄位沒變）不算編輯：不寫記憶、不清官方品名。
   */
  planEdit(item, fields) {
    const next = this._fieldsOf(fields);
    const prev = this._fieldsOf(item);
    const changed = Object.keys(next).some(key => next[key] !== prev[key]);
    if (!changed) return { changed: false, fields: next, cacheEntry: null, catalog: item.catalog };
    const manual = item.catalog === 'missing' || item.catalog === 'unverified';
    return { changed: true, fields: next, cacheEntry: { ...next, source: manual ? 'manual' : 'edit' }, catalog: item.catalog || 'edited' };
  }
};

// ========== OuterBoxLabel (列印外箱明細：A4 直式一頁上下各一箱；合併、取官方品名、分頁、排版。純邏輯，相依的東西都從參數傳入，不碰 DOM、state、localStorage) ==========
const OuterBoxLabel = {
  LOOKUP_CHUNK: 200,
  // 紙張（A4 直式，邊界 上 10.5mm、左右下 8mm，可用範圍 194 × 278.5mm）：每頁上下各一個半頁區塊（135mm），中間 6mm 放裁切虛線，虛線中心剛好在 10.5 + 135 + 3 = 148.5mm（紙張正中央）。
  // 量到的高度要留一點餘裕（邊框與四捨五入），所以分頁用的上限比區塊小 3mm。
  HALF_LIMIT_MM: 132,
  FULL_LIMIT_MM: 273,

  /** 與後端 src/sheets.ts 的 buildMergedName 完全一致：有性別 → 品名(性別-顏色尺寸)；沒有性別 → 品名(顏色尺寸)；都沒有 → 只有品名。 */
  buildMergedName(productName, gender, color, size) {
    let mergedName = productName;
    if (productName) {
      const colorSize = (color || '') + (size || '');
      if (gender || colorSize) {
        mergedName = productName + '(';
        mergedName += gender ? gender + '-' + colorSize : colorSize;
        mergedName += ')';
      }
    }
    return mergedName;
  },

  _text(value) {
    return value === undefined || value === null ? '' : String(value).trim();
  },

  _qtyOf(item) {
    return Math.max(1, Math.floor(Number(item.qty)) || 1);
  },

  /** 空箱不能選。 */
  isSelectable(box) {
    return Array.isArray(box.items) && box.items.length > 0;
  },

  /** 選擇視窗每一箱的摘要：幾種商品（不同編號）、幾件。 */
  summarize(box) {
    const codes = new Set();
    let pieces = 0;
    for (const item of box.items) {
      codes.add(this._text(item.barcode));
      pieces += this._qtyOf(item);
    }
    return { kinds: codes.size, pieces };
  },

  /** 預設勾選：mode 'box'＝只勾那一箱；mode 'stats'＝所有已完成的箱（沒有已完成的就全勾）。空箱一律不勾。回傳依列表順序的箱號。 */
  defaultSelection(boxes, mode, boxId) {
    const selectable = boxes.filter(box => this.isSelectable(box));
    if (mode === 'box') return selectable.filter(box => box.id === boxId).map(box => box.id);
    const closed = selectable.filter(box => box.status === 'closed');
    return (closed.length > 0 ? closed : selectable).map(box => box.id);
  },

  /** 勾選順序：勾起來加到最後、取消就移除（列印依這個順序排版）。 */
  toggleOrder(order, boxId, checked) {
    const rest = order.filter(id => id !== boxId);
    return checked ? [...rest, boxId] : rest;
  },

  // ---- 從商品主檔載入別台裝置已完成的箱子（POST /api/boxes/lookup）----
  // 載入的箱子只活在選擇視窗的記憶體裡：不進箱子清單、不寫入任何儲存。清單項目的鍵是 sheet:<日期>|<箱號>|<關箱時間>|<序>，不會與本機箱號相撞。
  BOXES_LOOKUP_URL: '/api/boxes/lookup',
  SHEET_ERROR_FALLBACK: '無法讀取商品主檔，請稍後再試',
  SHEET_KEY_PREFIX: 'sheet:',
  MAX_QTY: 9999,

  _clampQty(value) {
    const n = Math.floor(Number(value));
    if (Number.isNaN(n)) return 1;
    return Math.min(this.MAX_QTY, Math.max(1, n));
  },

  /** 台北時間（UTC+8）的今天，YYYY-MM-DD。nowMs 是 epoch 毫秒（可注入，測試用）。 */
  taipeiToday(nowMs) {
    return new Date(nowMs + 8 * 60 * 60 * 1000).toISOString().slice(0, 10);
  },

  /** 關箱時間 → 只顯示 HH:MM；空白或認不得的格式回空字串。 */
  formatClosedTime(closedAt) {
    const m = /(\d{1,2}):(\d{2})/.exec(this._text(closedAt));
    return m ? m[1].padStart(2, '0') + ':' + m[2] : '';
  },

  sheetKey(date, boxId, closedAt, seq) {
    return this.SHEET_KEY_PREFIX + date + '|' + boxId + '|' + closedAt + '|' + seq;
  },

  isSheetKey(key) {
    return typeof key === 'string' && key.startsWith(this.SHEET_KEY_PREFIX);
  },

  /**
   * 把 API 回來的箱子整理成選擇視窗用的項目（同一個箱號可以有很多筆，各有不同的鍵；數量一律 1～9999；沒有商品的箱子略過）。
   * 回傳 [{ key, id, closedAt, status: 'sheet', items }]。
   */
  loadSheetBoxes(date, rawBoxes) {
    const out = [];
    (Array.isArray(rawBoxes) ? rawBoxes : []).forEach((raw, seq) => {
      if (!raw || typeof raw !== 'object' || !Array.isArray(raw.items)) return;
      const items = raw.items.filter(it => it && typeof it === 'object').map(it => ({
        barcode: this._text(it.barcode),
        productName: this._text(it.productName),
        gender: this._text(it.gender),
        color: this._text(it.color),
        size: this._text(it.size),
        mergedName: this._text(it.mergedName),
        qty: this._clampQty(it.qty)
      }));
      if (items.length === 0) return;
      const id = this._text(raw.boxId) || '（無箱號）';
      const closedAt = this._text(raw.closedAt);
      out.push({ key: this.sheetKey(date, this._text(raw.boxId), closedAt, seq), id, closedAt, status: 'sheet', items });
    });
    return out;
  },

  /** 從勾選順序拿掉指定的鍵（重新載入時拿掉舊的一批；其他勾選不動）。 */
  dropKeys(order, keys) {
    const drop = new Set(keys);
    return order.filter(key => !drop.has(key));
  },

  /** 全選（pick 'all'）／只選已完成（pick 'closed'）：本機可選的箱號＋載入的箱子（載入的都算已完成）。回傳勾選順序（本機在前、載入的在後）。 */
  pickAll(localBoxes, sheetBoxes, pick) {
    const local = localBoxes.filter(b => this.isSelectable(b) && (pick === 'all' || b.status === 'closed')).map(b => b.id);
    return [...local, ...sheetBoxes.filter(b => this.isSelectable(b)).map(b => b.key)];
  },

  /** 勾選順序（本機箱號或載入的鍵）→ [{ kind: 'local'|'sheet', box }]，找不到或空箱的略過。 */
  resolveOrder(order, localBoxes, sheetBoxes) {
    const out = [];
    for (const key of order) {
      const sheet = this.isSheetKey(key) ? sheetBoxes.find(b => b.key === key) : null;
      const box = sheet || localBoxes.find(b => b.id === key);
      if (box && this.isSelectable(box)) out.push({ kind: sheet ? 'sheet' : 'local', box });
    }
    return out;
  },

  /**
   * 讀商品主檔裡別台裝置已完成的箱子。失敗一律回 { ok: false, error }（error 是可直接顯示的中文；API 沒給就用固定句），不丟例外。
   * 成功回 { ok: true, boxes: loadSheetBoxes(...) }。
   */
  async fetchSheetBoxes(api, date) {
    try {
      const resp = await api.post(this.BOXES_LOOKUP_URL, { date });
      let body = null;
      try { body = await resp.json(); } catch (e) { body = null; }
      if (!resp.ok || !body || body.success !== true) {
        const error = body && typeof body.error === 'string' && body.error.trim() ? body.error.trim() : this.SHEET_ERROR_FALLBACK;
        return { ok: false, error };
      }
      if (!body.data || !Array.isArray(body.data.boxes)) return { ok: false, error: this.SHEET_ERROR_FALLBACK };
      return { ok: true, boxes: this.loadSheetBoxes(date, body.data.boxes) };
    } catch (e) {
      return { ok: false, error: this.SHEET_ERROR_FALLBACK };
    }
  },

  /**
   * 載入的一列印什麼品名：總表查得到、而且總表的品名／性別／顏色／尺寸（trim 後）與這一列完全相同 → 總表的官方品名；
   * 其他（查不到、有任何一欄不同＝被人員改過、沒有編號、查詢失敗）→ 這一列的 mergedName，空白就用欄位組。
   */
  sheetRowName(rep, product) {
    if (product && this._text(product.officialName)) {
      const same = ['productName', 'gender', 'color', 'size'].every(f => this._text(product[f]) === this._text(rep[f]));
      if (same) return this._text(product.officialName);
    }
    return this._text(rep.mergedName)
      || this.buildMergedName(this._text(rep.productName), this._text(rep.gender), this._text(rep.color), this._text(rep.size));
  },

  /**
   * 載入的箱子整理成要印的資料（與 prepare 同形：[{ id, rows: [{ barcode, name, qty }], total }]，另帶 key）。
   * 同箱同編號合併、數量加總（上限 9999）、依編號排序；所有商品編號去重後批次查總表（一次最多 200 個）。查詢失敗不擋列印。
   */
  async prepareSheet(sheetBoxes, opts) {
    const grouped = sheetBoxes.map(box => {
      const map = new Map();
      for (const item of box.items) {
        const code = this._text(item.barcode);
        if (!map.has(code)) map.set(code, { barcode: code, qty: 0, items: [] });
        const group = map.get(code);
        group.qty = Math.min(this.MAX_QTY, group.qty + this._clampQty(item.qty));
        group.items.push(item);
      }
      const groups = Array.from(map.values()).sort((a, b) => a.barcode.localeCompare(b.barcode, 'en', { numeric: true }));
      for (const group of groups) {
        group.rep = group.items.find(it => this._text(it.mergedName) || this._text(it.productName)) || group.items[0];
      }
      return { box, groups };
    });
    const codes = [];
    const seen = new Set();
    for (const { groups } of grouped) {
      for (const group of groups) {
        if (group.barcode && !seen.has(group.barcode)) {
          seen.add(group.barcode);
          codes.push(group.barcode);
        }
      }
    }
    const catalog = new Map();
    let lookupFailed = false;
    for (let i = 0; i < codes.length; i += this.LOOKUP_CHUNK) {
      let result = null;
      try { result = await opts.lookup(codes.slice(i, i + this.LOOKUP_CHUNK)); } catch (e) { result = null; }
      if (!result || !result.ok) {
        lookupFailed = true;
        continue;
      }
      for (const [code, product] of result.products) catalog.set(code, product);
    }
    const boxes = grouped.map(({ box, groups }) => {
      const rows = groups.map(group => ({
        barcode: group.barcode,
        name: this.sheetRowName(group.rep, group.barcode ? catalog.get(group.barcode) : null),
        qty: group.qty
      }));
      return { key: box.key, id: box.id, rows, total: rows.reduce((sum, row) => sum + row.qty, 0) };
    });
    return { boxes, lookupFailed };
  },

  /** 把本機箱子與載入的箱子各自整理好的結果，依勾選順序（resolveOrder 的結果）接回同一個陣列。 */
  mergePrepared(chosen, localPrepared, sheetPrepared) {
    let li = 0;
    let si = 0;
    return chosen.map(entry => (entry.kind === 'sheet' ? sheetPrepared[si++] : localPrepared[li++])).filter(Boolean);
  },

  /** 同一箱同一個編號合併成一列（數量加總），依商品編號由小到大。 */
  groupBox(box) {
    const map = new Map();
    for (const item of box.items) {
      const code = this._text(item.barcode);
      if (!map.has(code)) map.set(code, { barcode: code, qty: 0, items: [] });
      const group = map.get(code);
      group.qty += this._qtyOf(item);
      group.items.push(item);
    }
    const groups = Array.from(map.values()).sort((a, b) => a.barcode.localeCompare(b.barcode, 'en', { numeric: true }));
    for (const group of groups) {
      group.rep = group.items.find(item => this._text(item.officialName)) || group.items.find(item => this._text(item.productName)) || group.items[0];
    }
    return groups;
  },

  /** 改版前加入的舊商品（沒有 officialName、也沒有 catalog）才需要查總表；人員編輯過的（catalog 為 'edited'，或 found 但官方品名已清掉）與手動輸入的不查。 */
  needsLookup(group) {
    return !this._text(group.rep.officialName) && group.rep.catalog === undefined;
  },

  /**
   * 整理要印的資料。opts.lookup(barcodes) → { ok, products: Map }（一次最多 200 個）。
   * 商品名稱：有 officialName → 用它；舊商品 → 總表查到的官方品名（只用於這次列印，不改箱子裡的資料）；否則用欄位組出品名。
   * 回傳 { boxes: [{ id, rows: [{ barcode, name, qty }], total }], lookupFailed }。
   */
  async prepare(boxes, opts) {
    const grouped = boxes.map(box => ({ box, groups: this.groupBox(box) }));
    const need = [];
    const seen = new Set();
    for (const { groups } of grouped) {
      for (const group of groups) {
        if (this.needsLookup(group) && !seen.has(group.barcode)) {
          seen.add(group.barcode);
          need.push(group.barcode);
        }
      }
    }
    const official = new Map();
    let lookupFailed = false;
    for (let i = 0; i < need.length; i += this.LOOKUP_CHUNK) {
      let result = null;
      try { result = await opts.lookup(need.slice(i, i + this.LOOKUP_CHUNK)); } catch (e) { result = null; }
      if (!result || !result.ok) {
        lookupFailed = true;
        continue;
      }
      for (const [code, product] of result.products) {
        if (product.officialName) official.set(code, product.officialName);
      }
    }
    const out = grouped.map(({ box, groups }) => {
      const rows = groups.map(group => {
        const rep = group.rep;
        const name = this._text(rep.officialName)
          || (this.needsLookup(group) ? official.get(group.barcode) : '')
          || this.buildMergedName(this._text(rep.productName), this._text(rep.gender), this._text(rep.color), this._text(rep.size));
        return { barcode: group.barcode, name, qty: group.qty };
      });
      return { id: box.id, rows, total: rows.reduce((sum, row) => sum + row.qty, 0) };
    });
    return { boxes: out, lookupFailed };
  },

  /**
   * 分頁（純函式）。boxes: [{ id, rows, total, metrics: { headH, contHeadH, footH, rowHs } }]（高度是實際量到的，每列不等高）；
   * limits: { half, full } 半頁與整頁可用高度（同單位）。
   * 放得下半頁的箱子依序兩兩配成一頁；放不下半頁的箱子自己佔整頁、放不下整頁就接到下一頁（任何一列都不截斷）；
   * 大箱前後不補位、維持原順序。接續段標 continued，合計（showFooter）只在該箱最後一段。
   * 回傳 [{ full: boolean, slots: [{ boxId, rows, continued, showFooter, total }] }]。
   */
  paginate(boxes, limits) {
    const pages = [];
    let waiting = null; // 只有一個小箱、等著配對的半頁
    const sum = values => values.reduce((a, b) => a + b, 0);
    for (const box of boxes) {
      const m = box.metrics;
      if (m.headH + sum(m.rowHs) + m.footH <= limits.half) {
        const slot = { boxId: box.id, rows: box.rows, continued: false, showFooter: true, total: box.total };
        if (waiting) {
          waiting.slots.push(slot);
          waiting = null;
        } else {
          waiting = { full: false, slots: [slot] };
          pages.push(waiting);
        }
        continue;
      }
      waiting = null;
      let start = 0;
      let continued = false;
      for (;;) {
        let used = continued ? m.contHeadH : m.headH;
        let end = start;
        while (end < box.rows.length && (end === start || used + m.rowHs[end] <= limits.full)) {
          used += m.rowHs[end];
          end += 1;
        }
        if (end === box.rows.length && (used + m.footH <= limits.full || end - start <= 1)) {
          pages.push({ full: true, slots: [{ boxId: box.id, rows: box.rows.slice(start, end), continued, showFooter: true, total: box.total }] });
          break;
        }
        if (end === box.rows.length) end -= 1; // 合計放不下：最後一列連同合計移到下一頁，不留「只有合計」的一頁
        pages.push({ full: true, slots: [{ boxId: box.id, rows: box.rows.slice(start, end), continued, showFooter: false, total: box.total }] });
        start = end;
        continued = true;
      }
    }
    return pages;
  },

  /** 一個箱段的表格（格式照現用的 Word 範本）：箱號大字 → 欄名 → 商品列 → 合計。所有動態內容經 esc。 */
  renderTable(slot, esc) {
    const title = '箱號：' + slot.boxId + (slot.continued ? '（續）' : '');
    let html = '<table class="ob-table"><colgroup><col class="ob-col-code"><col class="ob-col-name"><col class="ob-col-qty"></colgroup><tbody>';
    html += '<tr class="ob-title"><th colspan="3">' + esc(title) + '</th></tr>';
    html += '<tr class="ob-colhead"><th class="ob-code">商品編號</th><th>商品名稱</th><th class="ob-qty">數量</th></tr>';
    for (const row of slot.rows) {
      html += '<tr class="ob-row"><td class="ob-code">' + esc(row.barcode) + '</td><td>' + (esc(row.name) || '—') + '</td><td class="ob-qty">' + esc(String(row.qty)) + '</td></tr>';
    }
    if (slot.showFooter) html += '<tr class="ob-total"><td colspan="3">合計：' + esc(String(slot.total)) + ' 件</td></tr>';
    return html + '</tbody></table>';
  },

  renderPages(pages, esc) {
    return pages.map(page => {
      if (page.full) return '<section class="ob-page"><div class="ob-slot ob-slot-full">' + this.renderTable(page.slots[0], esc) + '</div></section>';
      const second = page.slots[1] ? this.renderTable(page.slots[1], esc) : '';
      return '<section class="ob-page"><div class="ob-slot">' + this.renderTable(page.slots[0], esc) + '</div><div class="ob-cut"></div><div class="ob-slot">' + second + '</div></section>';
    }).join('');
  },

  /**
   * 量實際高度（唯一碰 DOM 的地方，doc 從參數傳入）：把每一箱完整排進畫面外的容器（與列印同一份樣式），
   * 讀每一列的高度（品名會換行，每列不等高）與半頁／整頁的可用高度。回傳 { boxes（每箱加上 metrics）, limits }。
   */
  measure(doc, prepared, esc) {
    const host = doc.createElement('div');
    host.className = 'ob-measure';
    doc.body.appendChild(host);
    try {
      const probe = mm => {
        const el = doc.createElement('div');
        el.style.height = mm + 'mm';
        host.appendChild(el);
        const height = el.getBoundingClientRect().height;
        el.remove();
        return height;
      };
      const rowHeights = slot => {
        host.innerHTML = this.renderTable(slot, esc);
        const table = host.querySelector('table');
        const trs = Array.from(table.querySelectorAll('tr'));
        const tops = trs.map(tr => tr.getBoundingClientRect().top);
        const bottom = table.getBoundingClientRect().bottom;
        return tops.map((top, i) => (i + 1 < tops.length ? tops[i + 1] : bottom) - top);
      };
      const boxes = prepared.map(box => {
        const heights = rowHeights({ boxId: box.id, rows: box.rows, continued: false, showFooter: true, total: box.total });
        const contHeights = rowHeights({ boxId: box.id, rows: [], continued: true, showFooter: false, total: box.total });
        return {
          ...box,
          metrics: {
            headH: heights[0] + heights[1],
            contHeadH: contHeights[0] + contHeights[1],
            footH: heights[heights.length - 1],
            rowHs: heights.slice(2, heights.length - 1)
          }
        };
      });
      return { boxes, limits: { half: probe(this.HALF_LIMIT_MM), full: probe(this.FULL_LIMIT_MM) } };
    } finally {
      host.remove();
    }
  }
};

// Capture photo and send to OCR
document.getElementById('btn-capture').addEventListener('click', async () => {
  const videoEl = document.getElementById('camera-video');
  const statusEl = document.getElementById('ocr-status');
  const captureBtn = document.getElementById('btn-capture');
  const box = BoxManager.getCurrentBox();
  if (!box || box.status === 'closed') {
    showToast('請先建立或選擇一個開放中的箱號', 'error');
    return;
  }

  const frame = CameraEngine.captureFrame(videoEl);
  if (!frame) {
    showToast('無法擷取畫面，請確認相機已開啟', 'error');
    return;
  }

  captureBtn.disabled = true;
  statusEl.style.display = '';
  statusEl.textContent = '辨識中，請稍候…';

  try {
    const result = await OCREngine.recognize(frame, box.id);
    statusEl.textContent = '';
    statusEl.style.display = 'none';
    captureBtn.disabled = false;

    if (!result) {
      showToast('辨識失敗，請重新拍照', 'error');
      return;
    }

    // OCR 只取商品編號：回來的品名、性別、顏色、尺寸一律不採用，也不預填視窗（品名由商品總表決定）
    const barcode = String(result.barcode || result.productCode || '').trim();
    await scanBarcode(barcode);
  } catch(e) {
    statusEl.textContent = '';
    statusEl.style.display = 'none';
    captureBtn.disabled = false;
    showToast('辨識發生錯誤：' + e.message, 'error');
  }
});

function readScanQty() {
